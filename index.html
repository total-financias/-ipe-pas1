function contentFor(assuntoId){
  if(!STATE.content[assuntoId]) STATE.content[assuntoId] = {attempts:0,correct:0,status:'red',lastSeen:null,srDue:null,srInterval:0,firstDate:null};
  const c = STATE.content[assuntoId];
  if(c.correctWeighted==null) c.correctWeighted = c.correct||0; // migração: registros antigos sem confiança herdam o valor bruto
  if(!c.recent) c.recent = [];
  return c;
}
function weightedAcc(c){
  if(!c.attempts) return null;
  const cw = c.correctWeighted!=null ? c.correctWeighted : c.correct;
  return cw/c.attempts;
}

function hexToHsl(hex){
  const r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b); let h,s; const l=(max+min)/2;
  if(max===min){h=s=0;} else {
    const d=max-min; s=l>0.5? d/(2-max-min) : d/(max+min);
    if(max===r) h=(g-b)/d+(g<b?6:0); else if(max===g) h=(b-r)/d+2; else h=(r-g)/d+4;
    h/=6;
  }
  return [h*360,s*100,l*100];
}
function hslToHex(h,s,l){
  s/=100; l/=100;
  const k=n=>(n+h/30)%12;
  const a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  const toHex=x=>Math.round(255*x).toString(16).padStart(2,'0');
  return '#'+toHex(f(0))+toHex(f(8))+toHex(f(4));
}

function isEffectivelyDark(mode){
  if(mode==='dark') return true;
  if(mode==='light') return false;
  return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
}
function customThemePalette(hex, dark){
  const [h,s,l] = hexToHsl(hex);
  const lClamped = Math.min(Math.max(l,22),62); // clamp de luminosidade pra manter contraste legível em claro e escuro
  const sBoost = Math.max(s,35);
  const accent = hslToHex(h,sBoost,lClamped);
  const accentStrong = hslToHex(h,sBoost,Math.max(lClamped-14,8));
  const accentInk = lClamped>55 ? '#20281F' : '#FFFFFF';
  const sBg = Math.min(s,22);
  const base = dark
    ? {bg:hslToHex(h,sBg,9),surface:hslToHex(h,sBg,14),surface2:hslToHex(h,sBg,18),border:hslToHex(h,sBg+6,27),ink:'#F0F0EA',inkSoft:'#C9C7BE',muted:'#96948A'}
    : {bg:hslToHex(h,Math.min(sBg,14),96),surface:'#FFFFFF',surface2:hslToHex(h,Math.min(sBg,16),91),border:hslToHex(h,Math.min(sBg,20),80),ink:'#20221C',inkSoft:'#4B5245',muted:'#8A8267'};
  return {...base, accent, accentStrong, accentInk};
}
function customBgOverride(hex){
  const [h,s,l] = hexToHsl(hex);
  if(l>50) return {bg:hex, surface:hslToHex(h,Math.min(s,20),Math.min(l+6,98)), surface2:hslToHex(h,Math.min(s,25),Math.max(l-6,80)), border:hslToHex(h,Math.min(s,30),Math.max(l-18,65)), ink:'#1C1C1A', inkSoft:'#4A4A45', muted:'#88887F'};
  return {bg:hex, surface:hslToHex(h,Math.min(s,25),Math.min(l+5,22)), surface2:hslToHex(h,Math.min(s,28),Math.min(l+10,28)), border:hslToHex(h,Math.min(s,30),Math.min(l+20,38)), ink:'#F0F0EA', inkSoft:'#C9C7BE', muted:'#96948A'};
}
const BG_MODE_OVERRIDES = {

const TOKEN_CSS_VAR = {bg:'--bg',surface:'--surface',surface2:'--surface-2',surfaceElevated:'--surface-elevated',border:'--border',ink:'--ink',inkSoft:'--ink-soft',muted:'--muted',accent:'--accent',accentStrong:'--accent-strong',accentInk:'--accent-ink',accentSoft:'--accent-soft',accent2:'--accent-2',accent2Ink:'--accent-2-ink'};
function themePaletteFor(ap, dark){
  let palette;
  if(ap.colorTheme==='custom' && ap.customHex) palette = customThemePalette(ap.customHex, dark);
  else palette = (THEME_PALETTES[ap.colorTheme] || THEME_PALETTES.original)[dark?'dark':'light'];
  const bgMode = ap.bgMode || 'auto';
  if(bgMode==='custom' && ap.bgHex) palette = {...palette, ...customBgOverride(ap.bgHex)};
  else if(BG_MODE_OVERRIDES[bgMode]) palette = {...palette, ...BG_MODE_OVERRIDES[bgMode]};
  // deriva tons que os temas nao precisam declarar manualmente (superficie elevada e destaque suave)
  if(!palette.surfaceElevated){
    const [h,s,l] = hexToHsl(palette.surface);
    palette = {...palette, surfaceElevated: hslToHex(h, s, dark? Math.min(l+4,95) : Math.max(l-2,88))};
  }
  if(!palette.accentSoft){
    const [ah,as] = hexToHsl(palette.accent);
    const [,,sl] = hexToHsl(palette.surface);
    palette = {...palette, accentSoft: hslToHex(ah, Math.min(as,32), dark? Math.min(sl+9,30) : Math.max(sl-6,90))};
  }
  return palette;
}
function applyAppearance(){
  const ap = STATE.appearance || {colorTheme:'original', mode:'system'};

  else if(ap.mode==='dark') root.setAttribute('data-theme','dark');
  else root.removeAttribute('data-theme');
  root.removeAttribute('data-color-theme');
  const dark = isEffectivelyDark(ap.mode||'system');
  const palette = themePaletteFor(ap, dark);
  Object.keys(TOKEN_CSS_VAR).forEach(key=>{
    if(palette[key]) root.style.setProperty(TOKEN_CSS_VAR[key], palette[key]);
    else root.style.removeProperty(TOKEN_CSS_VAR[key]);
  });
  root.setAttribute('data-layout', ap.layout||'dashboard');
  root.setAttribute('data-menu', ap.menu||'sidebar');

/* Onda ao clicar em qualquer botão — delegado no document (registrado uma única vez, funciona
   mesmo com o DOM sendo trocado inteiro a cada render()). */
document.addEventListener('pointerdown', (e)=>{
  const btn = e.target.closest('.btn');
  if(!btn || btn.disabled) return;
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height) * 1.4;
  const ripple = document.createElement('span');
  ripple.className = 'btn-ripple';
  ripple.style.width = ripple.style.height = size+'px';
  ripple.style.left = (e.clientX - rect.left - size/2)+'px';
  ripple.style.top = (e.clientY - rect.top - size/2)+'px';
  btn.appendChild(ripple);

/* ============================= PHASE & PRIORITY ============================= */
function daysLeft(){ return Math.max(0, daysBetween(new Date(), EXAM_DATE)); }
function totalPlanDays(){ return Math.max(1, daysBetween(new Date(STATE.startDate+'T00:00:00'), EXAM_DATE)); }
function phaseInfo(){
  const total = totalPlanDays(), left = daysLeft();
  const elapsedPct = 1 - (left/total);
  if(elapsedPct < .25) return {n:1,nome:'Base',emoji:'🌱',foco:'Fundamentos e interpretação',contPrat:[70,30]};
  if(elapsedPct < .55) return {n:2,nome:'Consolidação',emoji:'🌿',foco:'Conteúdo + prática crescente',contPrat:[40,60]};
  if(elapsedPct < .80) return {n:3,nome:'Modo PAS',emoji:'🌳',foco:'Questões estilo PAS e interdisciplinaridade',contPrat:[20,80]};
  if(elapsedPct < .95) return {n:4,nome:'Simulados',emoji:'🌼',foco:'Simulados e correção de rota',contPrat:[10,90]};
  return {n:5,nome:'Reta Final',emoji:'🏆',foco:'Revisão, erros recorrentes e estratégia',contPrat:[5,95]};
}

function accuracyOf(assuntoId){
  const c = STATE.content[assuntoId];
  if(!c || c.attempts===0) return null;
  return c.correct/c.attempts; // acerto bruto, exibido ao aluno — não ponderado por confiança
}
function statusFromAccuracy(acc, attempts, firstDate){
  if(attempts===0 || acc===null) return 'red';
  if(acc<0.40) return 'red';
  if(acc<0.70) return 'orange';
  if(acc<0.85) return 'yellow';
  // green requires retention: at least one attempt logged 2+ days after first attempt
  if(firstDate){
    const days = daysBetween(new Date(firstDate+'T00:00:00'), new Date());
    if(days>=2) return 'green';
  }
  return 'yellow';
}
function refreshAllStatuses(){
  ASSUNTOS.forEach(a=>{
    const c = contentFor(a.id);
    c.status = statusFromAccuracy(weightedAcc(c), c.attempts, c.firstDate);
  });
}
function diagnosticAccFor(materiaId){
  const s = STATE.diagnostic.materiaScore && STATE.diagnostic.materiaScore[materiaId];
  return s ? s.acc : null;
}
function recentDeclineBoost(c){
  if(c.recent.length<3) return 0;
  const overall = weightedAcc(c); if(overall===null) return 0;
  const recentAcc = c.recent.filter(Boolean).length/c.recent.length;
  return recentAcc < overall-0.15 ? 3 : 0; // desempenho recente pior que a média histórica: sobe prioridade
}
function simuladoWeaknessBoost(assuntoId){
  // últimos 3 simulados: se o assunto apareceu entre os 5 mais fracos, isso também pressiona a prioridade
  const recentes = STATE.simulados.slice(-3);
  let boost = 0;
  recentes.forEach(sm=>{ if(sm.fracos && sm.fracos.includes(assuntoId)) boost += 2; });
  return Math.min(boost, 4);
}
function priorityScore(assunto){
  const c = contentFor(assunto.id);
  const diagAcc = diagnosticAccFor(assunto.materiaId);
  const acc = c.attempts ? weightedAcc(c) : (diagAcc!=null ? diagAcc : 0.3); // sem tentativas: usa diagnóstico, senão assume fraco
  const dificuldade = 1-acc;
  const erros = STATE.errors.filter(e=>e.assuntoId===assunto.id && !e.resolvido).length;
  const dueBoost = (c.srDue && c.srDue<=todayISO()) ? 6 : 0;
  const masteryPenalty = c.status==='green' ? 8 : 0;
  const recente = recentDeclineBoost(c);
  const simBoost = simuladoWeaknessBoost(assunto.id);
  const left = daysLeft();
  const urgencyMult = left<=20 ? 1.35 : left<=45 ? 1.15 : 1; // tempo restante: aperta prioridade dos pesados perto da prova
  return ((assunto.peso*2) + (dificuldade*4) + Math.min(erros,5) + dueBoost + recente + simBoost - masteryPenalty) * urgencyMult;
}
/* Pré-requisitos sugeridos (ordem de currículo, não é regra oficial da matriz) — usados só pra dar contexto na trilha visual. */
const PREREQ = {

function rankedAssuntos(){
  return [...ASSUNTOS].sort((a,b)=>priorityScore(b)-priorityScore(a));
}
function priorityBadge(assunto){
  const score = priorityScore(assunto);
  if(score>=22) return {emoji:'🔥',label:'Prioridade máxima',cls:'b-red'};

/* ============================= SPACED REPETITION ============================= */
const SR_STEPS = [1,7,15,30];
function scheduleSR(assuntoId, wasCorrect){
  const c = contentFor(assuntoId);
  if(!wasCorrect){ c.srInterval = 0; }
  else { c.srInterval = Math.min(c.srInterval+1, SR_STEPS.length-1); }
  const days = SR_STEPS[c.srInterval] || 1;
  const due = new Date(); due.setDate(due.getDate()+days);
  c.srDue = due.toISOString().slice(0,10);
}
function dueReviewsToday(){
  const today = todayISO();
  const contentDue = ASSUNTOS.filter(a=>{const c=contentFor(a.id); return c.srDue && c.srDue<=today;});
  const errorsDue = STATE.errors.filter(e=>e.nextReview && e.nextReview<=today);
  return {contentDue, errorsDue};
}

const LEVELS = [
  {key:'semente', emoji:'🌰', nome:'Semente', min:0},
  {key:'broto', emoji:'🌱', nome:'Broto', min:150},
  {key:'muda', emoji:'🌿', nome:'Muda', min:400},

function levelInfo(xp){
  let idx=0;
  for(let i=0;i<LEVELS.length;i++){ if(xp>=LEVELS[i].min) idx=i; }
  const cur = LEVELS[idx], next = LEVELS[idx+1]||null;
  const span = next? next.min-cur.min : 1;
  const into = xp-cur.min;
  return {cur, next, into, span, pct: next? Math.min(100,Math.round(into/span*100)) : 100, idx};
}
let LEVEL_UP_TOAST = null;
function checkLevelUp(prevXp, newXp){
  const before = levelInfo(prevXp).idx, after = levelInfo(newXp).idx;
  if(after>before) LEVEL_UP_TOAST = LEVELS[after];
}

/* ============================= ANSWER / XP ============================= */
function answerQuestion(q, correct, tempo){
  if(q.assuntoId){
    const c = contentFor(q.assuntoId);
    c.attempts++; if(correct) c.correct++;
    c.recent.push(correct); if(c.recent.length>6) c.recent.shift();
    if(!c.firstDate) c.firstDate = todayISO();
    c.lastSeen = todayISO();
    c.status = statusFromAccuracy(weightedAcc(c), c.attempts, c.firstDate); // recalculado de novo assim que a confiança é escolhida (setConfidence)
    scheduleSR(q.assuntoId, correct);
  }
  if(!STATE.qStats[q.id]) STATE.qStats[q.id] = {seen:0,correct:0};
  STATE.qStats[q.id].seen++; if(correct) STATE.qStats[q.id].correct++;
  const prevXp = STATE.profile.xp;
  STATE.profile.xp += correct? 10 : 3;
  checkLevelUp(prevXp, STATE.profile.xp);
  if(tempo!=null){ const ts=timeStats(); ts.totalSeg+=tempo; ts.count++; }
  logActivity({questoes:1});
  bumpStreak();
  save();
}
function bumpStreak(){
  const today = todayISO();
  if(STATE.profile.lastStudyDate===today) return;
  const yesterday = addDays(today,-1);
  STATE.profile.streak = (STATE.profile.lastStudyDate===yesterday) ? STATE.profile.streak+1 : 1;
  STATE.profile.lastStudyDate = today;
}
function setConfidence(confKey){
  const s = QUIZ_SESSION; if(!s) return;
  const r = s.results[s.idx]; const q = s.questions[s.idx];
  r.confidence = confKey;
  if(q.assuntoId){
    const c = contentFor(q.assuntoId);
    const conf = CONFIDENCE.find(x=>x.key===confKey) || CONFIDENCE[1];
    if(r.correct) c.correctWeighted = (c.correctWeighted||0) + conf.peso;
    c.status = statusFromAccuracy(weightedAcc(c), c.attempts, c.firstDate);
  }
  save(); render();
}

/* ============================= DAILY PLAN ============================= */
function taskDuration(type){
  return {aprender:18, questoes:22, revisao:12, obra:12, erros:10}[type] || 15;
}
function buildDailyPlan(minutes, opts){
  opts = opts || {};
  const phase = phaseInfo();
  const {contentDue, errorsDue} = dueReviewsToday();
  // modo relâmpago: só cabe UMA tarefa, então escolhe direto a de maior retorno (erro pendente > revisão vencida > ponto fraco)
  if(opts.fast){
    if(errorsDue.length) return {date:todayISO(), minutes, fast:true, tasks:[{id:'t_err',type:'erros',titulo:'Caderno de erros',sub:`Refazer ${Math.min(errorsDue.length,5)} questões que você já errou`,dur:minutes,status:'pendente'}]};
    if(contentDue.length){ const a=contentDue[0]; return {date:todayISO(), minutes, fast:true, tasks:[{id:'t_rev',type:'revisao',titulo:`Revisão — ${a.nome}`,sub:`${a.materiaNome} · revisão espaçada`,dur:minutes,assuntoId:a.id,status:'pendente'}]}; }
    const w = rankedAssuntos()[0];
    return {date:todayISO(), minutes, fast:true, tasks:[{id:'t_q_'+w.id,type:'questoes',titulo:`Questões — ${w.nome}`,sub:`${w.materiaNome} · treino relâmpago`,dur:minutes,assuntoId:w.id,status:'pendente'}]};
  }
  const tasks = [];
  let budget = minutes;
  // 1) spaced errors due (highest ROI: known content, fixable fast)
  if(errorsDue.length && budget>=taskDuration('erros')){
    tasks.push({id:'t_err',type:'erros',titulo:'Caderno de erros',sub:`Refazer ${Math.min(errorsDue.length,6)} questões que você já errou`,dur:taskDuration('erros'),status:'pendente'});
    budget -= taskDuration('erros');
  }
  // 2) spaced content review due
  if(contentDue.length && budget>=taskDuration('revisao')){
    const a = contentDue[0];
    tasks.push({id:'t_rev',type:'revisao',titulo:`Revisão — ${a.nome}`,sub:`${a.materiaNome} · revisão espaçada`,dur:taskDuration('revisao'),assuntoId:a.id,status:'pendente'});
    budget -= taskDuration('revisao');
  }
  // 3) fill with priority ranked assuntos, respecting phase content/practice ratio
  const ranked = rankedAssuntos().filter(a=>!tasks.find(t=>t.assuntoId===a.id));
  const pctContent = opts.tired ? Math.min(phase.contPrat[0], 20) : phase.contPrat[0]; // cansado: prioriza prática rápida (maior retorno) sobre aprender conteúdo novo
  let i=0;
  while(budget >= 10 && i < ranked.length){
    const a = ranked[i]; i++;
    const c = contentFor(a.id);
    const isNew = c.attempts===0;
    const useContent = isNew && (Math.random()*100 < pctContent || c.status==='red');
    if(useContent && budget>=taskDuration('aprender')){
      tasks.push({id:'t_learn_'+a.id,type:'aprender',titulo:`Aprender — ${a.nome}`,sub:`${a.materiaNome} · nível 1-4`,dur:taskDuration('aprender'),assuntoId:a.id,status:'pendente'});
      budget -= taskDuration('aprender');
    } else if(budget>=taskDuration('questoes') && questoesPorAssunto(a.id).length){
      tasks.push({id:'t_q_'+a.id,type:'questoes',titulo:`Questões — ${a.nome}`,sub:`${a.materiaNome} · treino`,dur:taskDuration('questoes'),assuntoId:a.id,status:'pendente'});
      budget -= taskDuration('questoes');
    }
    if(tasks.length>=6) break;
  }
  // 4) obra review if room and phase not too advanced-practice-only
  const obraPending = OBRAS.find(o=>(STATE.obrasStatus[o.id]||'novo')!=='dominado');
  if(obraPending && budget>=taskDuration('obra')){
    tasks.push({id:'t_obra',type:'obra',titulo:'Obra PAS',sub:`${obraPending.titulo}${obraPending.autor? ' — '+obraPending.autor:''}`,dur:taskDuration('obra'),obraId:obraPending.id,status:'pendente'});
    budget -= taskDuration('obra');
  }
  if(!tasks.length){
    tasks.push({id:'t_fallback',type:'questoes',titulo:'Treino rápido geral',sub:'5 questões variadas',dur:Math.min(minutes,15),status:'pendente'});
  }
  return {date:todayISO(), minutes, tired:!!opts.tired, tasks};
}
function ensureTodayPlan(){
  if(STATE.dailyPlan && STATE.dailyPlan.date===todayISO()) return STATE.dailyPlan;
  return null;
}
/* Projeção leve de um dia futuro (amanhã, depois...) pra Trilha — não é um plano real gravado,
   é só uma sugestão determinística baseada na priorização atual, excluindo assuntos já cobertos
   nos dias anteriores da projeção. Recalcula a cada render, então acompanha diagnóstico/erros/desempenho. */
function previewDayPlan(excludeIds, minutes){
  const ranked = rankedAssuntos().filter(a=>!excludeIds.includes(a.id));
  const tasks = [];
  let budget = minutes;
  let i=0;
  while(budget>=10 && i<ranked.length && tasks.length<4){
    const a = ranked[i]; i++;
    const c = contentFor(a.id);
    const isNew = c.attempts===0;
    if(isNew && c.status==='red' && budget>=taskDuration('aprender')){
      tasks.push({id:'p_learn_'+a.id,type:'aprender',titulo:`Aprender — ${a.nome}`,sub:a.materiaNome,dur:taskDuration('aprender'),assuntoId:a.id});
      budget -= taskDuration('aprender');
    } else if(budget>=taskDuration('questoes') && questoesPorAssunto(a.id).length){
      tasks.push({id:'p_q_'+a.id,type:'questoes',titulo:`Questões — ${a.nome}`,sub:a.materiaNome,dur:taskDuration('questoes'),assuntoId:a.id});
      budget -= taskDuration('questoes');
    }
  }
  if(!tasks.length && ranked.length){
    const a = ranked[0];
    tasks.push({id:'p_q_'+a.id,type:'questoes',titulo:`Questões — ${a.nome}`,sub:a.materiaNome,dur:taskDuration('questoes'),assuntoId:a.id});
  }
  return tasks;
}
function whyTaskHTML(t){
  if(!t.assuntoId) return 'Faz parte do seu plano por ajudar a manter o ritmo de estudos.';
  const a = getAssunto(t.assuntoId); if(!a) return '';
  const c = contentFor(a.id);
  const acc = c.attempts? Math.round(weightedAcc(c)*100) : null;
  const erros = STATE.errors.filter(e=>e.assuntoId===a.id && !e.resolvido).length;
  const prereqId = PREREQ[a.id]; const prereqAssunto = prereqId? getAssunto(prereqId): null;
  const reasons = [];
  if(acc!=null) reasons.push(`sua taxa de acerto aqui é ${acc}%`);
  else reasons.push('você ainda não praticou esse assunto');
  if(erros>0) reasons.push(`você tem ${erros} erro(s) pendente(s) nele`);
  if(prereqAssunto) reasons.push(`ele se conecta com "${prereqAssunto.nome}"`);
  reasons.push(`faltam ${daysLeft()} dias até a prova`);
  return `${a.nome} foi recomendado porque: ${reasons.join('; ')}.`;
}

let REVEAL_OBSERVER = null;
function initScrollReveal(isNewScreen){
  if(REVEAL_OBSERVER){ REVEAL_OBSERVER.disconnect(); REVEAL_OBSERVER = null; }
  if(!isNewScreen) return; // tela igual (só um dado mudou) — não reanima, evita "piscar" a cada clique
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cards = document.querySelectorAll('.view > .card');
  if(reduced || !window.IntersectionObserver || !cards.length) return;
  cards.forEach(el=>el.classList.add('reveal'));
  REVEAL_OBSERVER = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){ entry.target.classList.add('reveal-visible'); REVEAL_OBSERVER.unobserve(entry.target); }
    });
  }, {threshold:0.08, rootMargin:'0px 0px -40px 0px'});
  cards.forEach(el=>REVEAL_OBSERVER.observe(el));
  // rede de segurança: se por algum motivo o navegador não disparar o observer, o conteúdo não pode ficar preso invisível
  setTimeout(()=>{ cards.forEach(el=>el.classList.add('reveal-visible')); }, 1200);
}

function updateTabsFade(){
  const wrap = document.querySelector('.tabs-wrap');
  if(!wrap) return;
  const el = wrap.querySelector('.tabs');
  const leftFade = wrap.querySelector('.tabs-fade.left');
  const rightFade = wrap.querySelector('.tabs-fade.right');
  const sync = ()=>{
    leftFade.classList.toggle('show', el.scrollLeft > 4);
    rightFade.classList.toggle('show', el.scrollLeft < el.scrollWidth - el.clientWidth - 4);
  };
  sync();
  el.addEventListener('scroll', sync, {passive:true});
  if(window.ResizeObserver) new ResizeObserver(sync).observe(el);
}

    <div class="task-icon" style="${skipped?'opacity:.5;':''}">${TASK_ICON[t.type]||'📘'}</div>

      <div class="row" style="gap:6px;">
        <button class="btn btn-ghost btn-sm" data-action="skip-task" data-task="${t.id}">Pular</button>
        <button class="btn btn-primary btn-sm" data-action="start-task" data-task="${t.id}">Iniciar</button>
      </div>`}

function startTaskById(taskId){
  const task = STATE.dailyPlan.tasks.find(t=>t.id===taskId);
  if(!task) return;
  ACTIVE_TASK = {...task, _nivel:1};
  if(task.type==='questoes'||task.type==='revisao'){
    const list = task.assuntoId? questoesPorAssunto(task.assuntoId) : shuffle(QUESTOES).slice(0,5);
    // questões oficiais do PAS sobre o conteúdo do dia entram primeiro, quando existirem — o resto embaralhado
    const oficiaisDoDia = shuffle(list.filter(q=>q.oficial)).slice(0,2);
    const resto = shuffle(list.filter(q=>!oficiaisDoDia.includes(q)));
    startQuiz([...oficiaisDoDia, ...resto], task.type);
  } else if(task.type==='erros'){
    const ids = STATE.errors.filter(e=>!e.resolvido && e.nextReview<=todayISO()).slice(0,6).map(e=>e.questionId);
    startQuiz(QUESTOES.filter(q=>ids.includes(q.id)), 'erros');
  } else { render(); }
}
function weakestAssunto(){
  const seen = ASSUNTOS.filter(a=>contentFor(a.id).attempts>0);
  if(!seen.length) return null;
  return seen.sort((a,b)=>(accuracyOf(a.id)) - (accuracyOf(b.id)))[0];
}
function strongestAssunto(){
  const seen = ASSUNTOS.filter(a=>contentFor(a.id).attempts>=2);
  if(!seen.length) return null;
  return seen.sort((a,b)=>(accuracyOf(b.id)) - (accuracyOf(a.id)))[0];
}

function alertsHTML(){
  const alerts = [];
  // no diagnostic
  if(!STATE.diagnostic.done){
    alerts.push({icon:'🧭',text:'Você ainda não fez o diagnóstico inicial. Ele define seu plano — faça antes de continuar.',action:'diagnostico'});
  }
  // materia sem revisão há muitos dias
  AREAS.forEach(area=>area.materias.forEach(mat=>{
    const seenDates = mat.assuntos.map(a=>contentFor(a.id).lastSeen).filter(Boolean);
    if(seenDates.length){
      const mostRecent = seenDates.sort().reverse()[0];
      const dias = daysBetween(new Date(mostRecent+'T00:00:00'), new Date());
      if(dias>=10) alerts.push({icon:'⚠️',text:`Você não revisa ${mat.nome} há ${dias} dias.`});
    }
  }));
  const left = daysLeft();
  if(left<=20 && left>0) alerts.push({icon:'🎯',text:`Faltam ${left} dias. É hora de intensificar simulados e revisão.`});
  if(!alerts.length) return '';
  return alerts.slice(0,3).map(a=>`<div class="card-flat row" style="border-left:3px solid var(--accent-2);">${a.icon} <span style="font-size:.86rem;">${a.text}</span></div>`).join('');
}

/* ---------- QUIZ RUNNER ---------- */
function startQuiz(list, mode, extra){
  if(!list.length){ alert('Nenhuma questão disponível — tente afrouxar os filtros de tipo/dificuldade ou escolher outro assunto.'); ACTIVE_TASK=null; ROUTE='questoes'; render(); return; }
  QUIZ_SESSION = Object.assign({questions:list, idx:0, correctCount:0, mode, startTs:Date.now(), qStartTs:Date.now(), answered:false, results:[]}, extra||{});
  render();
}
function fmtElapsed(ms){
  const s = Math.floor(ms/1000);
  const m = Math.floor(s/60), r = s%60;
  return String(m).padStart(2,'0')+':'+String(r).padStart(2,'0');
}

      <div class="row" style="gap:6px;">
        ${!s.simulado? `<button class="btn btn-ghost btn-sm" data-action="toggle-focus">${s.focusMode?'🔎 Sair do foco':'🎯 Foco'}</button>` : ''}

      </div>
    </div>

      ${[['livre','Livre'],['25','25 min'],['45','45 min']].map(([k,l])=>`<button class="btn ${((s.timerMode||'livre')===k)?'btn-secondary':'btn-ghost'} btn-sm" data-action="set-timer-mode" data-tm="${k}">${l}</button>`).join('')}
      <span class="mono" style="font-size:.8rem;color:var(--muted);align-self:center;">${elapsedMin} min${(s.timerMode&&s.timerMode!=='livre')? ' / '+s.timerMode+' min':''}</span>
    </div>` : ''}
    ${(!s.simulado && elapsedMin>=50 && !s.pauseDismissed) ? `<div class="banner-info row-between">🧘 Você estudou ${elapsedMin} min. Que tal 5 min de pausa? <button class="btn btn-ghost btn-sm" data-action="dismiss-pause">Continuar</button></div>` : ''}
    <div class="qmeta">

  return xp;
}

/* ---------- SIMULADOS ---------- */
function startSimulado(typeKey, areaId){
  const type = SIMULADO_TYPES.find(t=>t.key===typeKey);
  let pool = QUESTOES;
  if(typeKey==='area' && areaId){
    const ids = ASSUNTOS.filter(a=>a.areaId===areaId).map(a=>a.id);
    pool = pool.filter(q=>ids.includes(q.assuntoId));
  }
  if(!pool.length){ alert('Ainda não há questões suficientes para esse simulado.'); return; }
  const n = Math.min(type.n, pool.length);
  const list = shuffle(pool).slice(0,n);
  ACTIVE_TASK = {type:'simulado', simTipo:typeKey};
  ROUTE='simulados';
  startQuiz(list, 'simulado', {simulado:true, tipo:typeKey, areaId:areaId||null});
}
function simuladoTrendHTML(hist){
  if(hist.length<2) return '';
  const pcts = hist.map(sm=>Math.round(sm.acertos/((sm.total-sm.brancos)||1)*100));
  const max = Math.max(...pcts,1);
  const first = pcts[0], last = pcts[pcts.length-1];
  const trend = last>first+3? '📈 Evoluindo' : last<first-3? '📉 Caindo' : '➡️ Estável';
  return `<div class="sparkline" style="margin-bottom:6px;">
    ${pcts.map(p=>`<div class="spark-bar"><div style="height:${Math.max(6,Math.round(p/max*100))}%;"></div></div>`).join('')}
  </div>
  <div class="label-eyebrow">${trend}</div>`;
}

  const ranked = Object.entries(porAssunto).map(([id,d])=>({a:getAssunto(id), acc:d.acertos/d.total, d}));

function submitAnswer(val){
  const s = QUIZ_SESSION; const q = s.questions[s.idx];
  const tempo = Math.round((Date.now()-s.qStartTs)/1000);
  if(val==='BRANCO'){
    s.results[s.idx] = {resposta:null, correct:false, branco:true, tempo};
    if(!STATE.qStats[q.id]) STATE.qStats[q.id] = {seen:0,correct:0};
    STATE.qStats[q.id].seen++;
    s.answered = true;
    save(); render();
    return;
  }
  const correct = q.tipo==='CE' ? (val===q.gab) : (Number(val)===q.gab);
  s.results[s.idx] = {resposta: q.tipo==='CE'? val : Number(val), correct, tempo};
  if(correct) s.correctCount++;
  answerQuestion(q, correct, tempo);
  if(s.mode==='desafio'){
    STATE.desafio.answered = true;
    if(correct){ const prevXp=STATE.profile.xp; STATE.profile.xp+=25; checkLevelUp(prevXp, STATE.profile.xp); }
    save();
  }
  s.answered = true;
  render();
}
function saveSimuladoResult(s){
  const total = s.questions.length;
  const acertos = s.results.filter(r=>r.correct).length;
  const brancos = s.results.filter(r=>r.branco).length;
  const erros = total - acertos - brancos;
  const tempoTotal = Math.round((Date.now()-s.startTs)/1000);
  const porAssunto = {};
  s.questions.forEach((q,i)=>{
    if(!q.assuntoId) return;
    if(!porAssunto[q.assuntoId]) porAssunto[q.assuntoId] = {acertos:0,total:0};
    porAssunto[q.assuntoId].total++;
    if(s.results[i].correct) porAssunto[q.assuntoId].acertos++;
  });
  const fracos = Object.entries(porAssunto).sort((a,b)=>(a[1].acertos/a[1].total)-(b[1].acertos/b[1].total)).slice(0,5).map(([id])=>id);
  STATE.simulados.push({id:'sim_'+Date.now(), date:todayISO(), tipo:s.tipo, areaId:s.areaId||null, total, acertos, erros, brancos, tempoTotal, tempoMedio:Math.round(tempoTotal/total), fracos});
  logActivity({simulados:1, minutos:Math.round(tempoTotal/60)});
}
function finalizeCurrentAnswer(){
  const s = QUIZ_SESSION; const q = s.questions[s.idx]; const r = s.results[s.idx];
  if(r.branco){
    // em branco não é erro de conteúdo — só avança, sem mexer no caderno de erros
  } else if(!r.correct && q.assuntoId){
    registrarErro(q, r.resposta, r.tempo, r.motivo || MOTIVOS[0]);
  } else if(r.correct && q.assuntoId){
    const err = STATE.errors.find(e=>e.questionId===q.id && !e.resolvido);
    if(err) registrarAcertoErroReview(err.id); // acerto confiante empurra a revisão espaçada pra frente (1→7→15→30)
  }
  if(ACTIVE_TASK && ACTIVE_TASK.type==='diagnostico'){ STATE.diagnostic.inProgress = JSON.parse(JSON.stringify(s)); }
  if(['erros','revisao','revisao-assunto'].includes(s.mode)) logActivity({revisoes:1});
  s.idx++; s.answered=false; s.qStartTs=Date.now();
  if(s.simulado && s.idx>=s.questions.length && !s.saved){ saveSimuladoResult(s); s.saved=true; }
  save(); render();
}

function materiaStats(mat){
  let attempts=0, correctW=0, worst=null, worstAcc=1;
  mat.assuntos.forEach(a=>{
    const c = contentFor(a.id);
    attempts += c.attempts||0;
    correctW += c.correctWeighted!=null ? c.correctWeighted : (c.correct||0);
    if(c.attempts>=3){ const acc = weightedAcc(c); if(acc!=null && acc<worstAcc){ worstAcc=acc; worst=a; } }
  });
  const dom = mat.assuntos.filter(a=>contentFor(a.id).status==='green').length;
  return {domPct: Math.round(dom/mat.assuntos.length*100), dom, total:mat.assuntos.length, attempts, accPct: attempts? Math.round(correctW/attempts*100) : null, worst};
}

function startDiagnostic(){
  ACTIVE_TASK = {type:'diagnostico'};
  STATE.diagnostic.inProgress = null;
  const diagQs = QUESTOES.filter(q=>q.diag);
  startQuiz(shuffle(diagQs), 'diagnostico');
}
function resumeDiagnostic(){
  ACTIVE_TASK = {type:'diagnostico'};
  QUIZ_SESSION = STATE.diagnostic.inProgress;
  render();
}
function finishDiagnostic(){
  const byMateria = {};
  QUIZ_SESSION.questions.forEach((q,i)=>{
    const a = getAssunto(q.assuntoId);
    if(!byMateria[a.materiaId]) byMateria[a.materiaId] = {total:0,correct:0};
    byMateria[a.materiaId].total++;
    if(QUIZ_SESSION.results[i] && QUIZ_SESSION.results[i].correct) byMateria[a.materiaId].correct++;
  });
  const materiaScore = {};
  Object.entries(byMateria).forEach(([mid,d])=>{
    const acc = d.correct/d.total;
    const nivel = acc<0.4?'baixo':acc<0.7?'médio':'alto';
    const prioridade = acc<0.4?'MUITO ALTA':acc<0.7?'ALTA':'MÉDIA';
    materiaScore[mid] = {nivel,prioridade,acc};
  });
  const top3 = Object.entries(materiaScore).sort((a,b)=>a[1].acc-b[1].acc).slice(0,3).map(([mid])=>mid);
  STATE.diagnostic = {done:true, materiaScore, top3};
  STATE.dailyPlan = null; // força replanejar já considerando o novo diagnóstico
  save();
}

function shuffle(arr){return [...arr].sort(()=>Math.random()-0.5);}
function startModeQuiz(mode){
  ACTIVE_TASK = {type:'banco', mode};
  const base = mode==='erros' ? QUESTOES : applyFilters(QUESTOES);
  let list = [];
  if(mode==='rapido') list = shuffle(base).slice(0,5);
  else if(mode==='padrao') list = shuffle(base).slice(0,10);
  else if(mode==='intensivo') list = shuffle(base).slice(0,20);
  else if(mode==='erros'){
    const ids = STATE.errors.filter(e=>!e.resolvido).map(e=>e.questionId);
    list = QUESTOES.filter(q=>ids.includes(q.id));
  } else if(mode==='fraco'){
    const w = weakestAssunto();
    list = w? applyFilters(questoesPorAssunto(w.id)) : [];
  } else if(mode==='pas'){
    list = shuffle(base.filter(q=>q.pas || q.dif==='dificil'));
  } else if(mode==='oficiais'){
    list = shuffle(applyFilters(QUESTOES.filter(q=>q.oficial)));
  }
  startQuiz(list, mode);
}

/* ---------- DESAFIO DO DIA ---------- */
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return Math.abs(h); }
function ensureDesafioDoDia(){
  const today = todayISO();
  if(STATE.desafio && STATE.desafio.date===today && STATE.desafio.questionId) return STATE.desafio;
  const oficiais = QUESTOES.filter(q=>q.oficial);
  const pool = oficiais.length? oficiais : QUESTOES;
  const idx = hashStr(today) % pool.length;
  STATE.desafio = {date:today, questionId:pool[idx].id, answered:false};
  save();
  return STATE.desafio;
}
function desafioView(){
  if(ACTIVE_TASK && ACTIVE_TASK.type==='desafio') return quizRunnerHTML();
  const d = ensureDesafioDoDia();
  const q = getQuestao(d.questionId);
  if(!q) return `<div class="empty">Desafio indisponível hoje.</div>`;
  if(d.answered){
    return `<div class="card" style="text-align:center;">
      <div style="font-size:1.8rem;">⚔️</div>
      <h2 class="title-md">Desafio de hoje concluído</h2>
      <p class="subtitle">Volte amanhã para um novo desafio.</p>
    </div>`;
  }
  return `<div class="card" style="text-align:center;">
    <div style="font-size:1.8rem;">⚔️</div>
    <h2 class="title-md">Desafio do dia</h2>
    <p class="subtitle">Uma questão especial pra hoje. Acerte e ganhe +25 XP de bônus.</p>
    <div class="qmeta" style="justify-content:center;">${q.oficial? `<span class="badge" style="background:var(--accent);color:var(--accent-ink);">🏛️ Oficial PAS ${q.ano}</span>` : `<span class="badge b-neutral">✍️ Treino</span>`}</div>

  </div>`;
}

const PROFESSOR_PROMPTS = [

  {key:'5q', label:'Me dê 5 questões'},

let PROFESSOR_LOG = [];
function professorReply(intent){
  const today = todayISO();
  if(intent==='20min'){
    const plan = buildDailyPlan(20);
    const linhas = plan.tasks.map(t=>`• ${t.titulo} (${t.dur} min)`).join('<br>');
    return {text:`Com 20 minutos, eu faria:<br>${linhas}`, action:{label:'Aplicar esse plano', act:'apply-plan-20'}};
  }
  if(intent==='erro-assunto'){
    const counts = {};
    STATE.errors.filter(e=>!e.resolvido).forEach(e=>{ counts[e.assuntoId] = (counts[e.assuntoId]||0)+1; });
    const top = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
    if(!top) return {text:'Você não tem erros pendentes registrados agora — mandou bem! Continue praticando pra manter assim.'};
    const a = getAssunto(top[0]);
    const motivos = {};
    STATE.errors.filter(e=>e.assuntoId===top[0]).forEach(e=>{ motivos[e.motivo] = (motivos[e.motivo]||0)+1; });
    const motivoTxt = Object.entries(motivos).sort((x,y)=>y[1]-x[1]).map(([m,c])=>`${m} (${c}x)`).join(', ');
    return {text:`Em <b>${a.nome}</b> você tem ${top[1]} erro(s) pendente(s). Motivo mais comum: ${motivoTxt}.`, action:{label:'Revisar esse assunto', act:'goto-assunto', assunto:top[0]}};
  }
  if(intent==='5q'){
    const a = rankedAssuntos()[0];
    return {text:`Sua prioridade agora é <b>${a.nome}</b>. Preparei 5 questões.`, action:{label:'Começar', act:'start-5q', assunto:a.id}};
  }
  if(intent==='revisar-erros'){
    const n = STATE.errors.filter(e=>!e.resolvido).length;
    if(!n) return {text:'Seu caderno de erros está vazio agora — nada pra revisar. 🎉'};
    return {text:`Você tem ${n} questão(ões) pendente(s) no caderno de erros.`, action:{label:'Revisar agora', act:'start-erros'}};
  }
  if(intent==='ontem'){
    const yesterday = addDays(today,-1);
    const as = ASSUNTOS.filter(a=>contentFor(a.id).lastSeen===yesterday);
    if(!as.length) return {text:'Não tenho registro de nada estudado ontem. Bora começar hoje?', action:{label:'Ver prioridade de hoje', act:'goto-priority'}};
    return {text:`Ontem você praticou: ${as.map(a=>a.nome).join(', ')}. Preparei um quiz de revisão.`, action:{label:'Começar quiz', act:'start-ontem', assuntos:as.map(a=>a.id)}};
  }
  return {text:'Ainda não sei responder isso — mas aqui está sua prioridade atual.', action:{label:'Ver prioridade', act:'goto-priority'}};
}

function evolutionInsightHTML(){
  const hist = STATE.history;
  if(hist.length<2) return `<p class="subtitle">Continue praticando — em alguns dias você vai começar a ver aqui sua evolução ao longo do tempo.</p>`;
  const target = addDays(todayISO(), -14);
  const past = [...hist].reverse().find(h=>h.date<=target);
  const now = hist[hist.length-1];
  if(!past || past.date===now.date) return `<p class="subtitle">Continue praticando — em alguns dias você vai começar a ver aqui sua evolução ao longo do tempo.</p>`;
  const delta = now.accuracy - past.accuracy;
  const arrow = delta>3?'📈':delta<-3?'📉':'➡️';
  return `<p class="subtitle">${arrow} Sua taxa de acerto foi de ${past.accuracy}% (em ${fmtDate(new Date(past.date+'T00:00:00'))}) para ${now.accuracy}% agora — ${delta>=0?'+':''}${delta} pontos.</p>`;
}

function weeklyEvolutionHTML(){
  const weeks = [];
  for(let i=5;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i*7);
    const dow = (d.getDay()+6)%7; const monday = new Date(d); monday.setDate(d.getDate()-dow); monday.setHours(0,0,0,0);
    const dates = []; for(let j=0;j<7;j++){ const x=new Date(monday); x.setDate(monday.getDate()+j); dates.push(x.toISOString().slice(0,10)); }
    const t = weekTotals(dates);
    weeks.push({label: fmtDate(monday), minutos:t.minutos});
  }
  const max = Math.max(1, ...weeks.map(w=>w.minutos));
  return `<div class="card">
    <h3>Evolução semanal (minutos estudados)</h3>
    <div class="sparkline" style="margin-top:8px;">
      ${weeks.map(w=>`<div class="spark-bar" title="Semana de ${w.label}: ${w.minutos} min"><div style="height:${Math.max(4, Math.round(w.minutos/max*100))}%;"></div></div>`).join('')}
    </div>
    <div class="row-between" style="font-size:.68rem;color:var(--muted);margin-top:4px;"><span>${weeks[0].label}</span><span>${weeks[weeks.length-1].label} (semana atual)</span></div>
  </div>`;
}

/* ---------- VISÃO SEMANAL ---------- */
const WEEKLY_GOAL = {questoes:150, minutos:600, revisoes:12, obras:2, simulados:1, redacoes:1};
function weekDates(){
  const d = new Date(); const dow = (d.getDay()+6)%7; // 0=segunda
  const monday = new Date(d); monday.setDate(d.getDate()-dow); monday.setHours(0,0,0,0);
  const arr = [];
  for(let i=0;i<7;i++){ const x = new Date(monday); x.setDate(monday.getDate()+i); arr.push(x.toISOString().slice(0,10)); }
  return arr;
}
function weekTotals(dates){
  const t = {questoes:0,minutos:0,revisoes:0,obras:0,simulados:0,redacoes:0};
  dates.forEach(d=>{ const a = STATE.activity[d]; if(a){ t.questoes+=a.questoes||0; t.minutos+=a.minutos||0; t.revisoes+=a.revisoes||0; t.obras+=a.obras||0; t.simulados+=a.simulados||0; t.redacoes+=a.redacoes||0; } });
  return t;
}
function dayState(dateISO, todayIso){
  if(dateISO===todayIso) return 'hoje';
  const a = STATE.activity[dateISO];
  if(dateISO>todayIso) return 'futuro';
  if(!a) return 'falhou';
  const score = (a.questoes||0) + (a.revisoes||0)*2 + (a.obras||0)*2 + (a.simulados||0)*5;
  if(score>=8) return 'completo';
  if(score>0) return 'parcial';
  return 'falhou';
}
function weeklyGoalRowHTML(label, val, goal){
  const pct = Math.min(100, Math.round(val/goal*100));
  return `<div style="margin-bottom:10px;">
    <div class="row-between"><span style="font-size:.85rem;font-weight:600;">${label}</span><span class="mono" style="font-size:.8rem;">${val}/${goal}</span></div>
    <div class="bar"><div style="width:${pct}%"></div></div>
  </div>`;
}
function semanaView(){
  const dates = weekDates();
  const today = todayISO();
  const totals = weekTotals(dates);
  const dayNames = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  const stateIcon = {hoje:'🎯', completo:'✅', parcial:'🟡', falhou:'❌', futuro:'·'};
  return `
  <div class="card">
    <h2 class="title-md">Minha semana</h2>
    <div class="week-grid">
      ${dates.map((d,i)=>`
        <div>
          <div class="label-eyebrow" style="margin-bottom:4px;">${dayNames[i]}</div>
          <div style="font-size:1.2rem;">${stateIcon[dayState(d,today)]}</div>
        </div>`).join('')}
    </div>
  </div>
  <div class="card">
    <div class="section-title"><h2>Meta semanal</h2></div>
    ${weeklyGoalRowHTML('Questões', totals.questoes, WEEKLY_GOAL.questoes)}
    ${weeklyGoalRowHTML('Horas', Math.round(totals.minutos/60*10)/10, Math.round(WEEKLY_GOAL.minutos/60))}
    ${weeklyGoalRowHTML('Revisões', totals.revisoes, WEEKLY_GOAL.revisoes)}
    ${weeklyGoalRowHTML('Obras', totals.obras, WEEKLY_GOAL.obras)}
    ${weeklyGoalRowHTML('Simulados', totals.simulados, WEEKLY_GOAL.simulados)}
    ${weeklyGoalRowHTML('Redações', totals.redacoes, WEEKLY_GOAL.redacoes)}
  </div>
  <div class="footer-note">✅ dia completo · 🟡 dia parcial · ❌ sem atividade registrada · 🎯 hoje. A meta semanal é uma referência geral fixa — ajuste seu ritmo conforme sua fase de estudo, não é uma regra oficial do PAS.</div>
  `;
}

  document.querySelectorAll('[data-action="professor-do"]').forEach(el=>el.addEventListener('click',()=>{
    const act = el.dataset.act;
    if(act==='apply-plan-20'){ STATE.dailyPlan = buildDailyPlan(20); save(); ROUTE='home'; render(); return; }
    if(act==='goto-assunto'){ MODAL='assuntoDetail'; ASSUNTO_DETAIL_ID=el.dataset.assunto; render(); return; }
    if(act==='start-5q'){ ACTIVE_TASK={type:'banco'}; ROUTE='questoes'; startQuiz(shuffle(applyFilters(questoesPorAssunto(el.dataset.assunto))).slice(0,5), 'professor'); return; }
    if(act==='start-erros'){ ROUTE='questoes'; startModeQuiz('erros'); return; }
    if(act==='start-ontem'){
      const ids = el.dataset.assuntos.split(',');
      const qs = ids.flatMap(id=>questoesPorAssunto(id));
      ACTIVE_TASK={type:'banco'}; ROUTE='questoes'; startQuiz(shuffle(qs).slice(0,10), 'professor');
      return;
    }
    if(act==='goto-priority'){ ROUTE='mapa'; MAPA_VIEW='lista'; render(); return; }
  }));

  document.querySelectorAll('[data-action="set-color-theme"]').forEach(el=>el.addEventListener('click',()=>{
    STATE.appearance.colorTheme = el.dataset.theme; delete STATE.appearance.customHex;
    save(); applyAppearance(); render();
  }));
  const applyCustomBtn = document.querySelector('[data-action="apply-custom-color"]');
  if(applyCustomBtn) applyCustomBtn.addEventListener('click',()=>{
    const hex = document.getElementById('customColorPick').value;
    STATE.appearance.colorTheme = 'custom'; STATE.appearance.customHex = hex;
    save(); applyAppearance(); render();
  });
  document.querySelectorAll('[data-action="set-mode"]').forEach(el=>el.addEventListener('click',()=>{
    STATE.appearance.mode = el.dataset.mode;
    save(); applyAppearance(); render();
  }));
  const restoreAppearanceBtn = document.querySelector('[data-action="restore-appearance"]');
  if(restoreAppearanceBtn) restoreAppearanceBtn.addEventListener('click',()=>{
    if(confirm('Restaurar aparência padrão (Ipê Original, modo sistema, Dashboard)?')){
      STATE.appearance = defaultState().appearance;
      save(); applyAppearance(); render();
    }
  });

  document.querySelectorAll('[data-action="set-layout"]').forEach(el=>el.addEventListener('click',()=>{
    STATE.appearance.layout = el.dataset.layout; save(); applyAppearance(); render();
  }));
  document.querySelectorAll('[data-action="set-density"]').forEach(el=>el.addEventListener('click',()=>{
    STATE.appearance.density = el.dataset.density; save(); applyAppearance(); render();
  }));
  document.querySelectorAll('[data-action="set-textsize"]').forEach(el=>el.addEventListener('click',()=>{
    STATE.appearance.textSize = el.dataset.ts; save(); applyAppearance(); render();
  }));
  document.querySelectorAll('[data-action="set-menu"]').forEach(el=>el.addEventListener('click',()=>{
    STATE.appearance.menu = el.dataset.menu; save(); applyAppearance(); render();
  }));
  document.querySelectorAll('[data-action="set-bgmode"]').forEach(el=>el.addEventListener('click',()=>{
    STATE.appearance.bgMode = el.dataset.bgmode; save(); applyAppearance(); render();
  }));
  const applyCustomBgBtn = document.querySelector('[data-action="apply-custom-bg"]');
  if(applyCustomBgBtn) applyCustomBgBtn.addEventListener('click',()=>{
    const hex = document.getElementById('customBgPick').value;
    STATE.appearance.bgMode = 'custom'; STATE.appearance.bgHex = hex;
    save(); applyAppearance(); render();
  });
  document.querySelectorAll('[data-action="toggle-sidebar"]').forEach(el=>el.addEventListener('click',()=>{
    STATE.appearance.sidebarCollapsed = !STATE.appearance.sidebarCollapsed; save(); applyAppearance(); render();
  }));
  document.querySelectorAll('[data-action="quick-toggle-menu"]').forEach(el=>el.addEventListener('click',()=>{
    STATE.appearance.menu = (STATE.appearance.menu==='sidebar') ? 'top' : 'sidebar';
    save(); applyAppearance(); render();
  }));
  document.querySelectorAll('[data-action="home-move"]').forEach(el=>el.addEventListener('click',()=>{
    const ap = STATE.appearance;
    const order = homeExtrasOrder(ap);
    const i = order.indexOf(el.dataset.key);
    const j = i + (el.dataset.dir==='up'? -1 : 1);
    if(i<0 || j<0 || j>=order.length) return;
    [order[i],order[j]] = [order[j],order[i]];
    ap.homeOrder = order; save(); render();
  }));
  document.querySelectorAll('[data-action="home-toggle"]').forEach(el=>el.addEventListener('click',()=>{
    const ap = STATE.appearance;
    const hidden = new Set(ap.homeHidden||[]);
    if(hidden.has(el.dataset.key)) hidden.delete(el.dataset.key); else hidden.add(el.dataset.key);
    ap.homeHidden = [...hidden]; save(); render();
  }));

  const openRecapBtn = document.querySelector('[data-action="open-day-recap"]');
  if(openRecapBtn) openRecapBtn.addEventListener('click',()=>{ MODAL='dayRecap'; render(); });
  const moreMenuBtn = document.querySelector('[data-action="open-more-menu"]');
  if(moreMenuBtn) moreMenuBtn.addEventListener('click',()=>{ MODAL = MODAL==='moreMenu'? null : 'moreMenu'; render(); });

  const focusBtn = document.querySelector('[data-action="toggle-focus"]');
  if(focusBtn) focusBtn.addEventListener('click',()=>{ QUIZ_SESSION.focusMode = !QUIZ_SESSION.focusMode; render(); });
  document.querySelectorAll('[data-action="set-timer-mode"]').forEach(el=>el.addEventListener('click',()=>{
    QUIZ_SESSION.timerMode = el.dataset.tm; render();
  }));
  const dismissPauseBtn = document.querySelector('[data-action="dismiss-pause"]');
  if(dismissPauseBtn) dismissPauseBtn.addEventListener('click',()=>{ QUIZ_SESSION.pauseDismissed = true; render(); });
}

function doExport(){
  const data = JSON.stringify(STATE, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ipe-pas1-backup-${todayISO()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function doImport(ev){
  const file = ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const parsed = JSON.parse(e.target.result);
      const def = defaultState();
      const defDiagnostic = def.diagnostic, defProfile = def.profile, defAppearance = def.appearance, defRedacao = def.redacao;
      const merged = Object.assign(def, parsed);
      merged.diagnostic = Object.assign(defDiagnostic, parsed.diagnostic||{});
      merged.profile = Object.assign(defProfile, parsed.profile||{});
      merged.appearance = Object.assign(defAppearance, parsed.appearance||{});
      merged.redacao = Object.assign(defRedacao, parsed.redacao||{});
      STATE = merged;
      applyAppearance();
      save(); render();
    }catch(err){ alert('Arquivo inválido.'); }
  };
  reader.readAsText(file);
}

/* ============================= INIT ============================= */
applyAppearance();
refreshAchievements();
render();
setInterval(()=>{
  if(!QUIZ_SESSION || !QUIZ_SESSION.simulado) return;
  const el = document.querySelector('.qcard .timer');
  if(el) el.textContent = '⏱ ' + fmtElapsed(Date.now()-QUIZ_SESSION.startTs);
}, 1000);
</script>
