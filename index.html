<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ipê PAS1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF7EE; --surface:#FFFFFF; --surface-2:#F2EAD3; --surface-elevated:#FFFFFF; --border:#E3D6B4;
  --ink:#20281F; --ink-soft:#4B5245; --muted:#8A8267;
  --accent:#2F6E4F; --accent-strong:#1F5138; --accent-ink:#F6FBF3; --accent-soft:#E1EEE5;
  --accent-2:#D9642A; --accent-2-ink:#FFF6EF;
  --red:#C1442A; --red-bg:#FBE7E1; --orange:#DE8A2E; --orange-bg:#FBEEDA;
  --yellow:#C9A227; --yellow-bg:#FAF3D6; --green:#2F8F5B; --green-bg:#E4F3EA;
  --shadow: 0 1px 2px rgba(32,40,31,.05), 0 2px 8px -4px rgba(32,40,31,.10);
  --radius:12px; --radius-sm:9px; --radius-lg:18px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px;
  --font-display:'Fraunces',Georgia,serif; --font-body:'Manrope',system-ui,sans-serif; --font-mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12160F; --surface:#1A2018; --surface-2:#222A1D; --surface-elevated:#232B1E; --border:#333B2B;
    --ink:#ECE7D8; --ink-soft:#C6C2AC; --muted:#8D9184;
    --accent:#5FBE8B; --accent-strong:#7ED3A5; --accent-ink:#0E1A13; --accent-soft:#1D3327;
    --accent-2:#F0925B; --accent-2-ink:#2A1408;
    --red:#F0897A; --red-bg:#3A1E17; --orange:#F0B26B; --orange-bg:#3A2C13;
    --yellow:#E3CE6E; --yellow-bg:#38310F; --green:#7ED3A5; --green-bg:#173322;
    --shadow: 0 1px 2px rgba(0,0,0,.25), 0 3px 10px -5px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#12160F; --surface:#1A2018; --surface-2:#222A1D; --surface-elevated:#232B1E; --border:#333B2B;
  --ink:#ECE7D8; --ink-soft:#C6C2AC; --muted:#8D9184;
  --accent:#5FBE8B; --accent-strong:#7ED3A5; --accent-ink:#0E1A13; --accent-soft:#1D3327;
  --accent-2:#F0925B; --accent-2-ink:#2A1408;
  --red:#F0897A; --red-bg:#3A1E17; --orange:#F0B26B; --orange-bg:#3A2C13;
  --yellow:#E3CE6E; --yellow-bg:#38310F; --green:#7ED3A5; --green-bg:#173322;
  --shadow: 0 1px 2px rgba(0,0,0,.25), 0 3px 10px -5px rgba(0,0,0,.4);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto;} }
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.5;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:var(--font-display);font-weight:600;text-wrap:balance;margin:0 0 .3em;}
h3{font-size:1.15rem;line-height:1.3;}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
a{color:inherit;}
button{font-family:var(--font-body);cursor:pointer;}
::selection{background:var(--accent);color:var(--accent-ink);}

#app{max-width:1160px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

/* header */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 10px;}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:700;font-size:1.05rem;}
.brand-mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(155deg,var(--accent),var(--accent-strong));display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.stat-pills{display:flex;gap:8px;align-items:center;}
.pill{display:flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--border);padding:5px 10px;border-radius:var(--radius-sm);font-size:.78rem;font-weight:600;color:var(--ink-soft);white-space:nowrap;}
.pill b{color:var(--ink);font-family:var(--font-mono);}
.pill.days{background:var(--accent);color:var(--accent-ink);border-color:transparent;}
.pill.days b{color:var(--accent-ink);}

.tabs-wrap{position:relative;}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:thin;}
.tabs-fade{position:absolute;top:0;bottom:10px;width:32px;pointer-events:none;opacity:0;transition:opacity .15s ease;}
.tabs-fade.left{left:0;background:linear-gradient(90deg,var(--bg),transparent);}
.tabs-fade.right{right:0;background:linear-gradient(270deg,var(--bg),transparent);}
.tabs-fade.show{opacity:1;}
.tab{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:var(--radius-sm);border:1px solid transparent;background:transparent;color:var(--muted);font-weight:600;font-size:.85rem;}
.tab.active{background:var(--surface-2);color:var(--ink);border-color:var(--border);}
.tab:hover:not(.active){color:var(--ink-soft);}
.tab-group-label{display:none;}
.sidebar-toggle{display:none;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;width:28px;height:28px;color:var(--ink-soft);font-size:.85rem;flex-shrink:0;}
.sidebar-toggle:hover{color:var(--ink);}

main{flex:1;padding:18px 16px 90px;max-width:100%;}
.view{display:flex;flex-direction:column;gap:var(--view-gap,16px);animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:var(--card-pad,18px);box-shadow:var(--shadow);}

/* ---- entrada suave ao abrir uma tela nova (scroll contínuo) ---- */
@media (prefers-reduced-motion: no-preference){
  .reveal{opacity:0;transform:translateY(14px);transition:opacity .5s cubic-bezier(.22,1,.36,1),transform .5s cubic-bezier(.22,1,.36,1);}
  .reveal.reveal-visible{opacity:1;transform:none;}
  .view>.reveal:nth-child(2){transition-delay:.05s;} .view>.reveal:nth-child(3){transition-delay:.1s;}
  .view>.reveal:nth-child(4){transition-delay:.15s;} .view>.reveal:nth-child(5){transition-delay:.2s;}
  .view>.reveal:nth-child(n+6){transition-delay:.24s;}
}

.card-flat{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:var(--flat-pad,16px);}
.card-elevated{background:var(--surface-elevated);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--card-pad,18px);}

/* ---- escala tipográfica (design system) ---- */
.text-display{font-family:var(--font-display);font-weight:600;font-size:2rem;line-height:1.1;letter-spacing:-.01em;}
.text-card-title{font-weight:700;font-size:.95rem;line-height:1.35;}
.text-body{font-size:.92rem;line-height:1.55;}
.text-meta{font-size:.78rem;color:var(--muted);}
.text-caption{font-size:.72rem;color:var(--muted);line-height:1.5;}
.row{display:flex;gap:10px;align-items:center;}
.row-between{display:flex;gap:10px;align-items:center;justify-content:space-between;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:560px){.grid2{grid-template-columns:1fr;}}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media(max-width:640px){.grid3{grid-template-columns:1fr 1fr;}}
/* ---- bento grid: usado só em telas de estatistica/progresso, composicao deliberada, nao uniforme ---- */
.bento{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(70px,auto);gap:10px;}
.bento-2x2{grid-column:span 2;grid-row:span 2;display:flex;flex-direction:column;justify-content:center;}
.bento-metric{display:flex;flex-direction:column;justify-content:center;}
@media(max-width:640px){.bento{grid-template-columns:repeat(2,1fr);} .bento-2x2{grid-column:span 2;grid-row:span 1;}}

.btn{display:inline-flex;align-items:center;gap:6px;justify-content:center;padding:10px 16px;border-radius:var(--radius-sm);border:none;font-weight:700;font-size:.88rem;transition:transform .1s,background-color .15s ease,border-color .15s ease;position:relative;overflow:hidden;isolation:isolate;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--accent);color:var(--accent-ink);}
.btn-secondary{background:var(--surface-2);color:var(--ink);border:1px solid var(--border);}
.btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--border);}
.btn-warn{background:var(--accent-2);color:var(--accent-2-ink);}
.btn-sm{padding:6px 12px;font-size:.78rem;}
.btn:disabled{opacity:.4;cursor:default;}
/* ---- onda ao clicar: unico feedback de movimento no botao, comunica "seu clique registrou" ---- */
.btn-ripple{position:absolute;border-radius:50%;background:color-mix(in srgb,currentColor 30%,transparent);transform:scale(0);pointer-events:none;z-index:0;}
@media (prefers-reduced-motion: no-preference){.btn-ripple{animation:btnRipple .5s ease-out;}}
@keyframes btnRipple{to{transform:scale(2.4);opacity:0;}}
.btn>*{position:relative;z-index:1;}
@media (hover:hover){
  .btn-primary:hover{background:var(--accent-strong);}
  .btn-secondary:hover{border-color:var(--accent);}
  .btn-ghost:hover{color:var(--ink);border-color:var(--accent);}
}
.btn-block{width:100%;}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:var(--radius-sm);font-size:.72rem;font-weight:700;letter-spacing:.02em;}
.b-red{background:var(--red-bg);color:var(--red);} .b-orange{background:var(--orange-bg);color:var(--orange);}
.b-yellow{background:var(--yellow-bg);color:var(--yellow);} .b-green{background:var(--green-bg);color:var(--green);}
.b-neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--border);}

.status-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.dot-red{background:var(--red);} .dot-orange{background:var(--orange);} .dot-yellow{background:var(--yellow);} .dot-green{background:var(--green);}

.bar{height:8px;border-radius:100px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border);}
.bar > div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-strong));border-radius:100px;transition:width .4s;}

.label-eyebrow,.text-label{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}

.task{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--border);}
.task:last-child{border-bottom:none;}
.task-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;background:var(--surface-2);}
.task-body{flex:1;min-width:0;}
.task-title{font-weight:700;font-size:.92rem;}
.task-sub{font-size:.78rem;color:var(--muted);}
.task.done .task-title{text-decoration:line-through;color:var(--muted);}
.task.done .task-icon{background:var(--green-bg);color:var(--green);}

.qcard{display:flex;flex-direction:column;gap:14px;}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;}
.qstatement{font-size:1.02rem;line-height:1.55;}
.opt{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface);font-weight:600;font-size:.92rem;text-align:left;}
.opt:hover{border-color:var(--accent);}
.opt.correct{border-color:var(--green);background:var(--green-bg);color:var(--green);}
.opt.wrong{border-color:var(--red);background:var(--red-bg);color:var(--red);}
.opt-row{display:flex;gap:10px;}
.opt-row .opt{flex:1;}

.chip-input{width:100%;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--ink);font-family:var(--font-body);font-size:.88rem;}
select.chip-input{appearance:none;}
textarea.chip-input{resize:vertical;min-height:64px;}

.tree-materia{margin-bottom:6px;}
.tree-materia > summary{cursor:pointer;list-style:none;padding:11px 4px;}
.tree-materia > summary::-webkit-details-marker{display:none;}
.materia-summary-row{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:.94rem;}
.tree-materia[open] > summary{color:var(--accent);}
.assunto-row{display:flex;align-items:center;gap:10px;padding:9px 4px 9px 14px;border-top:1px solid var(--border);font-size:.86rem;}
.assunto-row .name{flex:1;}
.assunto-row .hab{font-size:.7rem;color:var(--muted);font-family:var(--font-mono);}

.section-title{display:flex;align-items:center;gap:8px;}
.section-title h2{margin:0;font-size:1.15rem;}

.empty{text-align:center;padding:30px 10px;color:var(--muted);}

.footer-note{font-size:.74rem;color:var(--muted);line-height:1.6;padding:10px 4px 40px;}
.footer-note a{color:var(--accent);}

.timer{font-family:var(--font-mono);font-weight:700;font-size:1.4rem;}

.sparkline{display:flex;align-items:flex-end;gap:5px;height:70px;}
.spark-bar{flex:1;height:100%;background:var(--surface-2);border-radius:4px 4px 0 0;position:relative;min-height:4px;}
.spark-bar > div{position:absolute;bottom:0;left:0;right:0;background:var(--accent);border-radius:4px 4px 0 0;}

.obra-card{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;background:var(--surface);}
.obra-cat{font-size:.68rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--accent-2);}

.modal-bg{position:fixed;inset:0;background:rgba(20,24,17,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0;}
@media(min-width:640px){.modal-bg{align-items:center;}}
.modal{background:var(--surface);border-radius:20px 20px 0 0;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;padding:22px;box-shadow:var(--shadow);}
@media(min-width:640px){.modal{border-radius:20px;}}

.gauge-wrap{display:flex;align-items:center;gap:14px;}
.check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}

.time-choice{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.time-choice button{padding:12px 6px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface);font-weight:700;font-size:.85rem;}
.time-choice button.sel{border-color:var(--accent);background:var(--green-bg);color:var(--accent-strong);}

/* ---- Fase 1: design tokens, tipografia, hierarquia de botões, confiança/motivo, status oficial ---- */
:root{ --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px; --radius-lg:22px; }
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
}
.title-lg,.text-page-title{font-family:var(--font-display);font-weight:600;font-size:1.5rem;line-height:1.2;margin:0 0 4px;}
.title-md,.text-section-title{font-family:var(--font-display);font-weight:600;font-size:1.15rem;line-height:1.3;margin:0 0 4px;}
.subtitle,.text-secondary{font-size:.88rem;color:var(--ink-soft);line-height:1.5;}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid transparent;}
.btn-danger:hover{background:var(--red);color:#fff;}
.card{transition:border-color .15s;}
.opt:focus-visible,.btn:focus-visible,.tab:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.confidence-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.confidence-row button{padding:12px 6px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface);font-weight:700;font-size:.8rem;display:flex;flex-direction:column;align-items:center;gap:4px;}
.confidence-row button:hover{border-color:var(--accent);}
.confidence-row button span.emoji{font-size:1.3rem;}
.motivo-chips{display:flex;flex-wrap:wrap;gap:6px;}
.motivo-chips button{padding:7px 12px;border-radius:100px;border:1.5px solid var(--border);background:var(--surface);font-weight:600;font-size:.8rem;}
.motivo-chips button.sel{border-color:var(--accent);background:var(--green-bg);color:var(--accent-strong);}
.status-official{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:100px;margin:2px 4px 2px 0;}
.status-official.ok{background:var(--green-bg);color:var(--green);}
.status-official.pending{background:var(--yellow-bg);color:var(--yellow);}
.status-official.historic{background:var(--surface-2);color:var(--muted);border:1px solid var(--border);}
.mission-cta{display:flex;align-items:center;justify-content:center;gap:8px;font-size:1rem;padding:14px 18px;}
.banner-info{border-left:3px solid var(--accent);background:var(--surface-2);border-radius:var(--radius-sm);padding:10px 12px;font-size:.85rem;}
.priority-flag{font-size:.85rem;line-height:1;flex-shrink:0;}

/* ---- Fase 2: trilha, simulados, semana ---- */
.trail{display:flex;flex-direction:column;}
.trail-node{display:flex;align-items:flex-start;gap:12px;position:relative;padding-bottom:18px;cursor:pointer;}
.trail-node:last-child{padding-bottom:0;}
.trail-dot{width:34px;height:34px;border-radius:50%;background:var(--surface-2);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;z-index:1;}
.trail-line{position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--border);}
.trail-body{flex:1;padding-top:5px;}
.trail-name{font-weight:700;font-size:.9rem;}
.trail-sub{font-size:.76rem;color:var(--muted);}
.trail-node.suggested .trail-dot{background:var(--surface);border-style:dashed;border-color:var(--accent-2);}
.trail-node.suggested .trail-sub{color:var(--accent-2);font-weight:600;}
.trail-node:hover .trail-name{color:var(--accent);}
.sim-type-card{cursor:pointer;transition:border-color .15s;}
.sim-type-card:hover{border-color:var(--accent);}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;margin-top:10px;}

/* ---- Fase 3: temas de cor, níveis, conquistas, professor, personalização ---- */
:root[data-color-theme="azul"]{--accent:#2464EB;--accent-strong:#1B4FC4;--accent-ink:#F3F7FF;}
:root[data-color-theme="roxo"]{--accent:#7C3AED;--accent-strong:#6425C7;--accent-ink:#F8F5FF;}
:root[data-color-theme="laranja"]{--accent:#DD6A20;--accent-strong:#B8541A;--accent-ink:#FFF6EF;}
:root[data-color-theme="rosa"]{--accent:#DB2E72;--accent-strong:#B71F5C;--accent-ink:#FFF3F8;}
:root[data-color-theme="mono"]{--accent:#2B2B2B;--accent-strong:#000000;--accent-ink:#FFFFFF;--accent-2:#5A5A5A;--accent-2-ink:#FFFFFF;}
@media (prefers-color-scheme: dark){
  :root[data-color-theme="azul"]:not([data-theme="light"]){--accent:#6AA5FF;--accent-strong:#9CC4FF;--accent-ink:#0B1526;}
  :root[data-color-theme="roxo"]:not([data-theme="light"]){--accent:#B08AFB;--accent-strong:#C9AEFC;--accent-ink:#180F2E;}
  :root[data-color-theme="laranja"]:not([data-theme="light"]){--accent:#F0925B;--accent-strong:#F5AC80;--accent-ink:#2A1408;}
  :root[data-color-theme="rosa"]:not([data-theme="light"]){--accent:#F472A8;--accent-strong:#F79FC3;--accent-ink:#2E0F1D;}
  :root[data-color-theme="mono"]:not([data-theme="light"]){--accent:#E5E5E5;--accent-strong:#FFFFFF;--accent-ink:#141414;--accent-2:#B5B5B5;--accent-2-ink:#141414;}
}
:root[data-color-theme="azul"][data-theme="dark"]{--accent:#6AA5FF;--accent-strong:#9CC4FF;--accent-ink:#0B1526;}
:root[data-color-theme="roxo"][data-theme="dark"]{--accent:#B08AFB;--accent-strong:#C9AEFC;--accent-ink:#180F2E;}
:root[data-color-theme="laranja"][data-theme="dark"]{--accent:#F0925B;--accent-strong:#F5AC80;--accent-ink:#2A1408;}
:root[data-color-theme="rosa"][data-theme="dark"]{--accent:#F472A8;--accent-strong:#F79FC3;--accent-ink:#2E0F1D;}
:root[data-color-theme="mono"][data-theme="dark"]{--accent:#E5E5E5;--accent-strong:#FFFFFF;--accent-ink:#141414;--accent-2:#B5B5B5;--accent-2-ink:#141414;}

   ausente — data-force-top é recalculado via JS a partir de window.innerWidth a cada resize,
   como segunda checagem independente da media query. Isso evita a sidebar "de desktop" tomar
   conta da tela inteira em telas pequenas caso a media query sozinha se comporte de forma
   inesperada dentro de algum wrapper/preview (ex.: artifact). */

  :root[data-menu="sidebar"]:not([data-force-top="true"]) #app{flex-direction:row;align-items:flex-start;max-width:1320px;}

  :root[data-menu="sidebar"]:not([data-force-top="true"]) .tab-group-label{display:block;font-size:.68rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px;}

  :root[data-menu="sidebar"]:not([data-force-top="true"]) .tab{width:100%;justify-content:flex-start;border-radius:var(--radius-sm);border-left:2px solid transparent;}

/* Blindagem de viewport: garante a meta de viewport (caso algum wrapper/preview a remova) e
   detecta a largura REAL da tela pra nunca deixar o menu lateral (modo desktop) tomar conta
   de uma tela pequena, mesmo que a media query CSS avalie de forma inesperada dentro de algum
   iframe/preview. Recalcula a cada resize. */
(function(){
  if(!document.querySelector('meta[name="viewport"]')){
    const m = document.createElement('meta');
    m.name = 'viewport'; m.content = 'width=device-width, initial-scale=1';
    document.head.appendChild(m);
  }
  function updateForceTop(){
    const w = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
    document.documentElement.setAttribute('data-force-top', w<900 ? 'true' : 'false');
  }
  updateForceTop();
  window.addEventListener('resize', updateForceTop);
  if(window.visualViewport) window.visualViewport.addEventListener('resize', updateForceTop);
})();

 {id:'hum3',assuntoId:'hist_protagonismo',tipo:'CE',dif:'facil',diag:true,enun:'O Quilombo dos Palmares foi um dos maiores e mais duradouros quilombos do período colonial brasileiro.',gab:'C',res:'Palmares resistiu por a maior parte do século XVII, sendo um símbolo de resistência negra.'},
 {id:'hum4',assuntoId:'socio_desigualdades',tipo:'CE',dif:'dificil',diag:false,pas:true,enun:'A desigualdade social no Brasil pode ser plenamente compreendida considerando-se apenas o critério de renda, sem relação com raça ou território.',gab:'E',res:'A desigualdade brasileira é multidimensional: renda, raça, gênero e território se entrelaçam (ex.: racismo estrutural, segregação espacial).'},
 {id:'hum5',assuntoId:'geo_raciocinio',tipo:'CE',dif:'medio',diag:true,enun:'O conceito geográfico de território envolve necessariamente relações de poder sobre um espaço.',gab:'C',res:'Território, diferente de espaço, pressupõe controle/poder (político, econômico ou simbólico) sobre uma área.'},
 {id:'hum6',assuntoId:'filo_estetica',tipo:'MC',dif:'medio',diag:false,enun:'A estética, como campo da filosofia, estuda principalmente:',opts:['A lógica formal e os silogismos','A experiência da beleza e da arte','As estruturas de poder político','Os fenômenos econômicos'],gab:1,res:'A estética filosófica investiga a natureza da beleza, da arte e do julgamento estético.'},
 {id:'hum7',assuntoId:'hist_protagonismo',tipo:'CE',dif:'medio',diag:false,enun:'A historiografia contemporânea tem buscado dar maior protagonismo às narrativas indígenas e afro-brasileiras na construção da história do Brasil.',gab:'C',res:'É uma tendência historiográfica recente, presente inclusive nas obras de referência do PAS deste ciclo.'},
 {id:'hum8',assuntoId:'geo_economia',tipo:'CE',dif:'medio',diag:false,enun:'Questões econômico-ambientais podem ser analisadas sem qualquer relação com impactos sociais das atividades produtivas.',gab:'E',res:'Impactos ambientais (ex.: garimpo, desmatamento) costumam estar diretamente ligados a consequências sociais, como no caso Yanomami.'},
 {id:'hum9',assuntoId:'filo_logica',tipo:'CE',dif:'medio',diag:true,enun:'Um argumento é considerado logicamente válido quando, se as premissas forem verdadeiras, a conclusão necessariamente também é verdadeira.',gab:'C',res:'Essa é a definição de validade lógica de um argumento dedutivo.'},
 {id:'hum10',assuntoId:'socio_cultura',tipo:'CE',dif:'facil',diag:false,enun:'A diversidade sociocultural brasileira é fruto, entre outros fatores, da miscigenação entre povos indígenas, europeus e africanos.',gab:'C',res:'A formação do povo brasileiro envolveu esses três grandes grupos, entre outros.'},
 {id:'hum11',assuntoId:'filo_mitos',tipo:'CE',dif:'medio',diag:false,enun:'Os mitos, embora não sigam os critérios do método científico, possuem uma lógica interna própria que organiza a experiência humana do mundo.',gab:'C',res:'As mitologias são formas de expressão com lógica interna própria, distinta da lógica científica, mas igualmente organizadora de sentido.'},
 {id:'hum12',assuntoId:'filo_metodo',tipo:'CE',dif:'medio',diag:false,enun:'O conhecimento científico se diferencia de outras formas de discurso sobre o mundo social justamente por não possuir método nem resultados verificáveis.',gab:'E',res:'É o oposto: o conhecimento científico se distingue por ter métodos e resultados verificáveis, diferentemente do senso comum.'},
 {id:'hum13',assuntoId:'geo_cartografia',tipo:'CE',dif:'medio',diag:false,enun:'Mapas são representações neutras do espaço, sem nenhuma escolha ou intenção por parte de quem os produz.',gab:'E',res:'Toda representação cartográfica envolve escolhas (escala, projeção, o que destacar) que refletem intenções de quem a produz.'},
 {id:'hum14',assuntoId:'geo_populacao',tipo:'CE',dif:'facil',diag:false,enun:'A distribuição da população humana pelo espaço está relacionada tanto a fatores físicos (relevo, clima, recursos) quanto a fatores sociais e econômicos.',gab:'C',res:'A ocupação do espaço resulta da combinação entre condições físicas e dinâmicas sociais/econômicas.'},
 {id:'hum15',assuntoId:'geo_atlantico',tipo:'CE',dif:'medio',diag:false,enun:'A formação do espaço Atlântico, conectando África, Europa e América, não teve relação com a exploração colonial.',gab:'E',res:'Pelo contrário: a construção do espaço Atlântico está diretamente ligada à exploração colonial e ao tráfico transatlântico.'},
 {id:'hum16',assuntoId:'hist_diversidade',tipo:'CE',dif:'dificil',diag:false,pas:true,enun:'Os processos históricos e políticos que constituíram a diversidade sociocultural do Brasil geraram relações socioeconômicas igualitárias entre os diferentes grupos étnicos.',gab:'E',res:'Geraram relações desiguais — a formação da diversidade brasileira envolveu processos de exploração e hierarquização entre grupos.'},
 {id:'hum17',assuntoId:'hist_colonialidade',tipo:'CE',dif:'medio',diag:false,enun:'Os estudos decoloniais buscam resgatar e reinterpretar os saberes e identidades dos povos afetados pela lógica produtiva e simbólica colonial.',gab:'C',res:'Esse é justamente o objetivo dos estudos decoloniais: relativizar a narrativa colonial hegemônica.'},
 {id:'hum18',assuntoId:'hist_prehistoria',tipo:'CE',dif:'facil',diag:false,enun:'Havia produção cultural organizada em sociedades da África e da América antes da chegada dos europeus.',gab:'C',res:'Diversas culturas africanas e pré-colombianas tinham organização social e produção cultural complexas antes do contato europeu.'},
 {id:'hum19',assuntoId:'hist_diaspora',tipo:'CE',dif:'facil',diag:false,enun:'A diáspora atlântica refere-se ao deslocamento forçado de povos africanos para o continente americano no contexto da colonização.',gab:'C',res:'A diáspora atlântica está associada ao tráfico transatlântico de pessoas escravizadas.'},
 {id:'hum20',assuntoId:'hist_poder',tipo:'CE',dif:'medio',diag:false,enun:'A formação das monarquias nacionais europeias foi um processo anterior e sem relação com as antigas cidades-estado.',gab:'E',res:'Houve um processo histórico de transição das cidades-estado para as monarquias nacionais, com disputas de poder territorial.'},
 {id:'hum21',assuntoId:'hist_conceitos',tipo:'CE',dif:'medio',diag:false,enun:'Historicidade e geograficidade são formas de registrar e representar a memória sociocultural dos grupos humanos.',gab:'C',res:'Ambas as categorias tratam de como a memória social é registrada em diferentes dimensões (tempo/história e espaço/geografia).'},
 {id:'hum22',assuntoId:'socio_marcadores',tipo:'CE',dif:'facil',diag:false,enun:'Classe, raça, gênero e religião são exemplos de marcadores sociais que podem influenciar a posição de um indivíduo na sociedade.',gab:'C',res:'Esses são marcadores sociais amplamente discutidos pela sociologia para entender desigualdades e identidades.'},
 {id:'hum23',assuntoId:'socio_papeis',tipo:'CE',dif:'medio',diag:false,enun:'Na contemporaneidade, os papéis desempenhados por indivíduos e coletividades independem completamente das desigualdades de classe, gênero e etnia.',gab:'E',res:'Esses papéis estão frequentemente condicionados por desigualdades de classe, gênero e etnia presentes no processo produtivo, cultural e político.'},
 {id:'hum24',assuntoId:'socio_tecnologia',tipo:'CE',dif:'facil',diag:false,enun:'As tecnologias digitais têm influenciado os modos de pensar contemporâneos, sendo um tema relevante para a análise sociológica atual.',gab:'C',res:'A influência das tecnologias digitais sobre a cognição e a vida social é um objeto de análise sociológica contemporânea.'},
 {id:'hum25',assuntoId:'socio_praticas',tipo:'CE',dif:'medio',diag:false,enun:'As práticas sociais não têm relação com a produção e a ressignificação de discursos e valores em uma sociedade.',gab:'E',res:'As práticas sociais estão diretamente ligadas à produção, significação e ressignificação de discursos e valores.'},
 {id:'ling1',assuntoId:'port_morfo',tipo:'CE',dif:'medio',diag:true,enun:'Na frase "Os alunos estudaram muito para a prova", o termo "muito" exerce função de advérbio de intensidade.',gab:'C',res:'"Muito" modifica o verbo "estudaram", indicando intensidade — função típica de advérbio.'},
 {id:'ling2',assuntoId:'port_coesao',tipo:'CE',dif:'dificil',diag:true,pas:true,enun:'A coesão textual refere-se exclusivamente ao uso de conectivos, sem relação com a organização lógica das ideias.',gab:'E',res:'Coesão envolve conectivos, mas também recursos como referenciação e substituição; a organização lógica está mais ligada à coerência, que dialoga com a coesão.'},
 {id:'ling3',assuntoId:'port_variacao',tipo:'CE',dif:'facil',diag:true,enun:'A norma-padrão é a única forma linguística considerada adequada em qualquer contexto de comunicação.',gab:'E',res:'A adequação linguística depende do contexto; variações informais são adequadas em diversas situações comunicativas.'},
 {id:'ling4',assuntoId:'lit_trovador',tipo:'CE',dif:'medio',diag:false,enun:'As cantigas de amigo, típicas do trovadorismo galego-português, são geralmente narradas por uma voz feminina.',gab:'C',res:'Diferente da cantiga de amor (voz masculina), a cantiga de amigo tem eu-lírico feminino.'},
 {id:'ling5',assuntoId:'lit_classic',tipo:'CE',dif:'facil',diag:true,enun:'Luís de Camões é autor de "Os Lusíadas", épico que narra as navegações portuguesas.',gab:'C',res:'"Os Lusíadas" é a principal obra do Classicismo português, de autoria de Camões.'},
 {id:'ling6',assuntoId:'lit_barroco',tipo:'CE',dif:'medio',diag:false,enun:'O Barroco literário caracteriza-se, entre outros aspectos, pelo conflito entre valores espirituais e materiais.',gab:'C',res:'Esse conflito (fusão barroca) é típico da literatura barroca, presente em Gregório de Matos, por exemplo.'},
 {id:'ling7',assuntoId:'lit_arcadismo',tipo:'CE',dif:'medio',diag:false,enun:'O Arcadismo valoriza temas como a vida simples no campo (bucolismo) em contraposição à vida urbana.',gab:'C',res:'O ideal bucólico é uma marca central da estética arcádica.'},
 {id:'ling8',assuntoId:'port_interpret',tipo:'MC',dif:'medio',diag:true,enun:'Identificar o gênero textual de um texto (carta, notícia, poema...) ajuda principalmente a:',opts:['Decorar regras gramaticais','Compreender melhor sua função comunicativa e estrutura esperada','Contar o número de páginas do texto','Memorizar o nome do autor'],gab:1,res:'Reconhecer o gênero orienta expectativas sobre estrutura, finalidade e forma de leitura do texto.'},
 {id:'ling9',assuntoId:'le_leitura',tipo:'CE',dif:'facil',diag:false,enun:'A leitura em língua estrangeira no PAS avalia apenas vocabulário isolado, sem exigir interpretação do texto.',gab:'E',res:'A prova de língua estrangeira do PAS avalia compreensão leitora e interpretação, não só vocabulário solto.'},
 {id:'ling10',assuntoId:'lit_contemp',tipo:'CE',dif:'medio',diag:false,enun:'A literatura contemporânea brasileira, incluindo autores indígenas e afrodescendentes, amplia o debate sobre identidade e representatividade.',gab:'C',res:'Autores como Graça Graúna e Jeferson Tenório (presentes nas obras do PAS 1) trazem essas discussões.'},

 /* ===== QUESTÕES OFICIAIS REAIS — PAS 1, Subprograma 2023 (triênio 2023/2025), Cebraspe/UnB, aplicado em 03/12/2023 =====
    Extraídas do caderno de provas oficial (Parte 2) e conferidas item a item com o gabarito oficial definitivo publicado pela Cebraspe. */
 {id:'p23_16',assuntoId:'mat_conjuntos',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2023,itemOriginal:16,fonte:'PAS 1 — Subprograma 2023 (triênio 2023/2025), Cebraspe/UnB, aplicado em 03/12/2023',enun:'Um texto sobre o Cerrado brasileiro afirma que esse bioma detém "5% das espécies de todo o planeta e 30% da biodiversidade nacional". Considerando essa informação, é correto concluir que as espécies do Brasil correspondem a 3/20 das espécies da Terra.',gab:'E',res:'Se o Cerrado tem 5% das espécies do planeta e isso equivale a 30% da biodiversidade brasileira, o total do Brasil é 5%/0,30 ≈ 16,67% (1/6) das espécies da Terra — não 3/20 (15%). Um clássico erro de regra de três.'},
 {id:'p23_20',assuntoId:'mat_quadratica',tipo:'CE',dif:'dificil',diag:false,pas:true,oficial:true,ano:2023,itemOriginal:20,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Tabela de produção anual de um pequizeiro entre 10 e 15 anos após o plantio: 10→80, 11→117, 12→152, 13→185, 14→216, 15→245 frutos. Considere que a produção seja dada por Q(t) = -2t² + 108t - 576, para 10 ≤ t ≤ 45. No ano de maior produtividade, o pequizeiro produziu mais de 800 frutos.',gab:'C',res:'Vértice da parábola: t = -b/(2a) = -108/(-4) = 27 (dentro do domínio). Q(27) = -2(729)+108(27)-576 = -1458+2916-576 = 882 > 800. Correto.'},
 {id:'p23_21',assuntoId:'mat_quadratica',tipo:'CE',dif:'dificil',diag:false,pas:true,oficial:true,ano:2023,itemOriginal:21,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Ainda sobre o pequizeiro (10→80 frutos, 11→117, ...): se a função Q(t) = -t² + bt - 400 também representasse essa produção, o valor de b deveria ser superior a 80.',gab:'E',res:'Usando t=10, Q(10)=80: -100+10b-400=80 → 10b=580 → b=58. Como 58 não é superior a 80, o item está errado.'},
 {id:'p23_43',assuntoId:'mat_cartesiano',tipo:'NUM',dif:'medio',diag:false,oficial:true,ano:2023,itemOriginal:43,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'A obra "A última ceia", de Leonardo da Vinci, mede 4,60 m de altura por 8,80 m de largura. Uma reprodução mantém a mesma proporção e tem largura de 22 cm. Calcule, em cm², a área da reprodução (despreze a parte fracionária).',gab:253,res:'Altura da reprodução = 22 × (4,60/8,80) = 11,5 cm. Área = 22 × 11,5 = 253 cm².'},
 {id:'p23_90',assuntoId:'mat_conjuntos',tipo:'NUM',dif:'dificil',diag:false,pas:true,oficial:true,ano:2023,itemOriginal:90,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Um relatório da ONU estima que, em 2050, haverá no mundo duas pessoas com mais de 65 anos para cada uma com idade entre 0 e 4 anos. Considere que, em 2050, a população mundial será de 9 bilhões, das quais 10% serão crianças de 0 a 4 anos. Calcule, em dezenas de milhões, a quantidade de pessoas com idade entre 4 e 65 anos (despreze a parte fracionária).',gab:630,res:'Crianças (0–4): 10% de 9 bi = 900 milhões. Pessoas >65: o dobro = 1.800 milhões. Entre 4 e 65: 9.000 − 900 − 1.800 = 6.300 milhões = 630 dezenas de milhões.'},
 {id:'p23_100',assuntoId:'fis_mecanica',tipo:'NUM',dif:'dificil',diag:false,pas:true,oficial:true,ano:2023,itemOriginal:100,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Uma cadeira de rodas motorizada (20 kg), transportando uma pessoa de 120 kg, sobe em 25 s uma rampa com desnível h = 1,50 m. Desconsiderando dissipação de energia e usando g = 10 m/s², calcule, em watts, a potência do motor (despreze a parte fracionária).',gab:84,res:'Energia: E = m·g·h = 140×10×1,5 = 2.100 J. Potência = E/t = 2100/25 = 84 W.'},
 {id:'p23_64',assuntoId:'fis_astro',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2023,itemOriginal:64,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'A teoria sobre a esfericidade da Terra tem origem no pensamento aristotélico, na Grécia antiga, e pôde ser comprovada na contemporaneidade por meio de imagens de satélites e do GPS.',gab:'C',res:'Correto: Aristóteles defendeu a esfericidade da Terra em "Do Céu"; hoje isso é confirmado por satélites e GPS, tecnologias que dependem de um planeta esférico para funcionar.'},
 {id:'p23_67',assuntoId:'fis_mecanica',tipo:'CE',dif:'dificil',diag:false,pas:true,oficial:true,ano:2023,itemOriginal:67,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Somente conhecimentos comprovados por evidências empíricas podem ser considerados científicos; por isso, a teoria de Newton foi completamente descartada quando Einstein reformulou a ideia de espaço-tempo.',gab:'E',res:'Errado: a física newtoniana não foi descartada — continua sendo eficaz para descrever o movimento de corpos no sistema solar e na superfície da Terra; a relatividade só revela seus limites em outras escalas.'},
 {id:'p23_66',assuntoId:'filo_metodo',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2023,itemOriginal:66,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'A despeito do que sugerem os terraplanistas, a impossibilidade de reproduzir o Big Bang em laboratório não deslegitima as teorias científicas sobre a origem do universo.',gab:'C',res:'Correto: a ciência valida teorias também por evidências indiretas e previsões testáveis, não apenas por reprodução direta em laboratório.'},
 {id:'p23_69',assuntoId:'bio_metodo',tipo:'CE',dif:'dificil',diag:false,pas:true,oficial:true,ano:2023,itemOriginal:69,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'A teoria da panspermia cósmica postula que os primeiros seres surgiram nos oceanos e realizavam quimiossíntese a partir de compostos inorgânicos simples.',gab:'E',res:'Errado: a panspermia propõe que a vida (ou seus precursores) veio do espaço — não que tenha surgido nos oceanos terrestres. A descrição do item corresponde a outra hipótese.'},
 {id:'p23_52',assuntoId:'quim_historia',tipo:'CE',dif:'facil',diag:false,oficial:true,ano:2023,itemOriginal:52,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Considere a reação a C6H12O6 → b C2H5OH + c CO2, usada na produção de vinho e de etanol combustível. Técnicas experimentais, como a destilação, contribuíram para o desenvolvimento da química enquanto ciência.',gab:'C',res:'Correto: técnicas de separação e purificação como a destilação foram fundamentais para consolidar o método experimental da química.'},
 {id:'p23_53',assuntoId:'quim_conservacao',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2023,itemOriginal:53,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Sobre a mesma reação de fermentação (glicose → etanol + CO2): o etanol é uma fonte de energia não renovável, e sua produção a partir da cana-de-açúcar é motivada pela redução da poluição e do aquecimento global.',gab:'E',res:'Errado: o etanol de cana-de-açúcar é justamente um exemplo de fonte RENOVÁVEL (a cana pode ser replantada) — parte do motivo de seu uso como alternativa mais limpa.'},
 {id:'p23_54',assuntoId:'quim_ligacoes',tipo:'CE',dif:'dificil',diag:false,pas:true,oficial:true,ano:2023,itemOriginal:54,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'A água gaseificada é obtida a partir da água por adição de gás carbônico sob pressão. Esse processo aumenta a solubilidade do gás carbônico em decorrência de intensas interações intermoleculares.',gab:'C',res:'Correto: sob pressão, mais moléculas de CO2 interagem com as moléculas de água, aumentando sua solubilidade.'},
 {id:'p23_44',assuntoId:'bio_bioquimica',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2023,itemOriginal:44,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Sobre o pão ázimo (assado sem fermento, feito com farinha e água): na sua produção, observa-se um caso de fermentação lática, em que o carboidrato da massa é convertido em CO2 e água.',gab:'E',res:'Errado — pegadinha de leitura: o texto diz que o pão ázimo é feito "sem fermento". Sem fermento, não há fermentação nenhuma acontecendo.'},
 {id:'p23_45',assuntoId:'bio_bioquimica',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2023,itemOriginal:45,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'O vinho é produzido com base em fermentação alcoólica, na qual as bactérias presentes no suco da uva esmagada convertem o açúcar em CO2 e álcool.',gab:'E',res:'Errado: quem realiza a fermentação alcoólica são leveduras (fungos), não bactérias.'},
 {id:'p23_46',assuntoId:'bio_bioquimica',tipo:'CE',dif:'facil',diag:false,oficial:true,ano:2023,itemOriginal:46,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Nos pães feitos com farinha de trigo, o glúten forma uma rede de proteínas que proporciona elasticidade à massa.',gab:'C',res:'Correto: o glúten é formado por proteínas (glutenina e gliadina) que, hidratadas e sovadas, criam uma rede elástica.'},
 {id:'p23_47',assuntoId:'geo_economia',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2023,itemOriginal:47,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'O trigo, matéria-prima do pão e de diversos outros alimentos, é uma commodity, e o Brasil é autossuficiente na sua produção.',gab:'E',res:'Errado: o trigo é de fato uma commodity, mas o Brasil NÃO é autossuficiente — importa parte significativa do que consome.'},
 {id:'p23_55',assuntoId:'filo_correntes',tipo:'CE',dif:'facil',diag:false,oficial:true,ano:2023,itemOriginal:55,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Trecho de "O manual de Epicteto": "É ação de quem não se educou acusar os outros pelas coisas que ele próprio faz erroneamente. De quem começou a se educar, acusar a si próprio. De quem já se educou, não acusar os outros nem a si próprio." A educação pode transformar pessoas e sua postura frente aos próprios erros.',gab:'C',res:'Correto: o trecho descreve três estágios (não educado → começando a se educar → já educado), cada um com postura diferente frente ao erro.'},
 {id:'p23_56',assuntoId:'filo_correntes',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2023,itemOriginal:56,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Sobre o mesmo trecho de Epicteto: seu pensamento faz parte da tradição estoica e seus ensinamentos priorizam a ética.',gab:'C',res:'Correto: Epicteto é um dos principais filósofos estoicos, escola que enfatiza a ética e o autocontrole.'},
 {id:'p23_57',assuntoId:'filo_correntes',tipo:'CE',dif:'dificil',diag:false,pas:true,oficial:true,ano:2023,itemOriginal:57,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Ainda sobre o trecho: quem já se educou acusa a si próprio quando acusa os outros.',gab:'E',res:'Errado — leitura atenta: quem "já se educou" NÃO acusa nem os outros nem a si próprio. O item inventa uma relação que o texto não afirma.'},
 {id:'p23_58',assuntoId:'lit_generos',tipo:'MC',dif:'medio',diag:false,oficial:true,ano:2023,itemOriginal:58,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Na peça Antígona, de Sófocles, Antígona enterra:',opts:['sua irmã, cumprindo as ordens de Édipo, logo não pratica crime algum.','seu pai, contrariando as ordens de Creonte, logo pratica um crime.','sua mãe, cumprindo as ordens de Édipo, logo não pratica crime algum.','seu irmão, contrariando as ordens de Creonte, logo pratica um crime.'],gab:3,res:'Antígona desafia o decreto de Creonte (que proibira sepultar Polinices, tido como traidor) e enterra seu irmão mesmo assim — um ato de desobediência que, pela lei de Creonte, é um crime.'},
 {id:'p23_73',assuntoId:'lit_arcadismo',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2023,itemOriginal:73,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Poema de Cláudio Manoel da Costa: "Torno a ver-vos, ó montes; o destino / Aqui me torna a pôr nestes outeiros [...] Aqui descanse a louca fantasia, / E o que até agora se tornava em pranto / Se converta em afetos de alegria." O poema se organiza com base na expressão poética objetivista, sem expressividade lírica em primeira pessoa.',gab:'E',res:'Errado: o poema é claramente lírico e em primeira pessoa ("Torno a ver-vos", "Aqui estou").'},
 {id:'p23_74',assuntoId:'lit_arcadismo',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2023,itemOriginal:74,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Sobre o mesmo poema: ele se adéqua à estética do Trovadorismo, pela forma como retrata o ambiente natural brasileiro.',gab:'E',res:'Errado: Cláudio Manoel da Costa é autor arcadista, não trovadoresco — o poema usa o bucolismo típico do Arcadismo (vida simples no campo vs. vida na Corte).'},
 {id:'p23_76',assuntoId:'lit_arcadismo',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2023,itemOriginal:76,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Ainda sobre o poema: nele, o sujeito lírico desvaloriza a natureza que por ele mesmo é descrita.',gab:'E',res:'Errado: é o oposto — o eu lírico valoriza a vida simples do campo, dizendo que "o bem desta choupana" vale mais que "da cidade o lisonjeiro encanto".'},
 {id:'p23_77',assuntoId:'lit_arcadismo',tipo:'CE',dif:'facil',diag:false,oficial:true,ano:2023,itemOriginal:77,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Ainda sobre o poema: ele pode ser classificado como um soneto, haja vista seu esquema de rimas, métrica e estrofação.',gab:'C',res:'Correto: o poema tem 14 versos em dois quartetos e dois tercetos — a estrutura clássica do soneto.'},
 {id:'p23_80',assuntoId:'lit_arcadismo',tipo:'MC',dif:'medio',diag:false,oficial:true,ano:2023,itemOriginal:80,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Considerando o estilo de época do poema, os nomes "Almendro" e "Corino" referem-se a:',opts:['personagens mitológicos da Grécia antiga.','montes aos quais o sujeito lírico dirige o seu discurso.','membros da Corte de onde retorna o sujeito lírico.','"companheiros" do sujeito lírico, transfigurados em pastores árcades.'],gab:3,res:'No Arcadismo, o eu lírico assume um pseudônimo pastoril e convive com "companheiros" também transfigurados em pastores — exatamente o caso de Almendro e Corino.'},
 {id:'p23_12',assuntoId:'geo_economia',tipo:'CE',dif:'dificil',diag:false,pas:true,oficial:true,ano:2023,itemOriginal:12,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Os latossolos (solos avermelhados) do bioma Cerrado são ricos em nutrientes, o que garante sua fertilidade e proporciona êxito na produção agropecuária, razão por que a população da região Centro-Oeste se mantém predominantemente rural.',gab:'E',res:'Errado: apesar da força do agronegócio, a população do Centro-Oeste é majoritariamente URBANA — a conclusão não decorre logicamente da premissa sobre o solo.'},
 {id:'p23_15',assuntoId:'bio_ecologia',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2023,itemOriginal:15,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'O desmatamento nos biomas brasileiros tende a afetar o clima, uma vez que, quanto menos florestas, maior a concentração de calor na superfície terrestre e menor a retenção da água da chuva.',gab:'C',res:'Correto: florestas regulam temperatura e ajudam a reter água no solo; sua remoção intensifica calor e reduz retenção hídrica.'},
 {id:'p23_87',assuntoId:'socio_marcadores',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2023,itemOriginal:87,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'O aumento da expectativa de vida no Brasil não foi acompanhado de políticas de salvaguarda à população idosa, visto que inexiste legislação no país que priorize pessoas com idade acima de 60 anos.',gab:'E',res:'Errado: o Brasil possui legislação específica de proteção ao idoso (como o Estatuto do Idoso) — é falso dizer que "inexiste legislação".'},
 {id:'p23_88',assuntoId:'geo_urbanizacao',tipo:'CE',dif:'dificil',diag:false,pas:true,oficial:true,ano:2023,itemOriginal:88,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'As revoluções industriais melhoraram condições sanitárias e o acesso à educação e à saúde, porém esse conjunto de políticas não foi suficiente para eliminar as desigualdades socioespaciais, principalmente nos países do Sul global, dada a forma como isso interferiu na dinâmica populacional urbana.',gab:'C',res:'Correto: a industrialização trouxe avanços, mas a urbanização acelerada nos países do Sul global (inclusive o Brasil) ocorreu de forma desigual, gerando periferias precárias.'},
 {id:'p23_95',assuntoId:'port_coesao',tipo:'CE',dif:'dificil',diag:false,pas:true,oficial:true,ano:2023,itemOriginal:95,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Em um texto sobre acessibilidade: "Idosos, aqueles que enfrentam problemas de saúde e pessoas com deficiência estão entre os mais prejudicados." O segmento "aqueles que enfrentam problemas de saúde" restringe o sentido do termo "Idosos".',gab:'E',res:'Errado: são três grupos coordenados e distintos (idosos / pessoas com problemas de saúde / pessoas com deficiência), não uma restrição do primeiro pelo segundo.'},
 {id:'p23_99',assuntoId:'socio_desigualdades',tipo:'CE',dif:'facil',diag:false,oficial:true,ano:2023,itemOriginal:99,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'A falta de acessibilidade a espaços públicos e privados nas cidades brasileiras pode ser considerada uma forma de exclusão e segregação, pois restringe a mobilidade e o direito de todos os cidadãos aos espaços urbanos.',gab:'C',res:'Correto: acessibilidade é condição para o exercício pleno da cidadania urbana; sua ausência exclui pessoas com deficiência e mobilidade reduzida.'},

 /* ===== QUESTÕES OFICIAIS REAIS — PAS 1, Subprograma 2024 (triênio 2024/2026), Cebraspe/UnB, aplicado em 15/12/2024 =====
    Extraídas do caderno de provas oficial (Parte 2) e conferidas item a item com o gabarito oficial definitivo publicado pela Cebraspe. */
 {id:'p24_11',assuntoId:'port_morfo',tipo:'CE',dif:'dificil',diag:false,pas:true,oficial:true,ano:2024,itemOriginal:11,fonte:'PAS 1 — Subprograma 2024 (triênio 2024/2026), Cebraspe/UnB, aplicado em 15/12/2024',enun:'No primeiro parágrafo de um discurso sobre a jovem indígena Txai Suruí, o isolamento do trecho "o grande cacique Almir Suruí" entre vírgulas tem a finalidade de marcar uma inversão de termos no período.',gab:'E',res:'Errado: as vírgulas isolam um aposto explicativo ("o grande cacique Almir Suruí", referindo-se a "meu pai"), e não marcam inversão da ordem dos termos da frase.'},
 {id:'p24_16',assuntoId:'hist_diaspora',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2024,itemOriginal:16,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'Na América portuguesa, a escravização de indígenas era uma tarefa simples e foi bem-sucedida na maior parte das vezes, porque eles aceitaram passivamente a dominação pelos colonizadores.',gab:'E',res:'Errado: a escravização indígena enfrentou forte resistência (fugas, revoltas, alianças) e teve êxito limitado, sendo em grande parte substituída pela mão de obra africana.'},
 {id:'p24_22',assuntoId:'hist_diaspora',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2024,itemOriginal:22,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'O Brasil foi o principal destino de africanos escravizados nas Américas, sobretudo a partir do século XVII; assim, a forte presença africana na América portuguesa deu forma ao escravismo, instituição central no processo de formação da sociedade brasileira.',gab:'C',res:'Correto: o Brasil recebeu o maior contingente de africanos escravizados de todo o tráfico transatlântico, e a escravidão foi estruturante da sociedade colonial e imperial brasileira.'},
 {id:'p24_23',assuntoId:'hist_colonialidade',tipo:'CE',dif:'dificil',diag:false,pas:true,oficial:true,ano:2024,itemOriginal:23,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'A chamada diáspora africana deu início ao processo de civilização, aculturamento e organização social e política dos povos que habitavam o continente africano no século XV.',gab:'E',res:'Errado: é uma leitura eurocêntrica — os povos africanos já possuíam civilizações, culturas e organizações políticas complexas antes da diáspora provocada pelo tráfico transatlântico.'},
 {id:'p24_24',assuntoId:'hist_diaspora',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2024,itemOriginal:24,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'O comércio atlântico de africanos escravizados alterou fortemente a organização política, social e econômica de diversos reinos e grupos sociais do continente africano.',gab:'C',res:'Correto: o tráfico impactou profundamente as estruturas de poder africanas, gerando guerras, deslocamentos e reorganizações políticas ligadas à captura e venda de pessoas escravizadas.'},
 {id:'p24_26',assuntoId:'hist_protagonismo',tipo:'CE',dif:'facil',diag:false,oficial:true,ano:2024,itemOriginal:26,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'O Quilombo dos Palmares, o mais conhecido movimento insurgente de escravizados da história do Brasil, existiu por cerca de 100 anos, constituindo um espaço africano no interior do domínio colonial português da América.',gab:'C',res:'Correto: Palmares resistiu por praticamente todo o século XVII (cerca de 1600 a 1695), sendo o mais duradouro e conhecido quilombo do período colonial.'},
 {id:'p24_27',assuntoId:'hist_colonialidade',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2024,itemOriginal:27,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'A ocupação do território Kalunga, como no povoado de São José, evidencia um processo contínuo de construção identitária em que os moradores reconhecem sua origem quilombola, mesmo sem certificação oficial.',gab:'C',res:'Correto: mesmo sem o reconhecimento formal do Estado, comunidades como as do território Kalunga mantêm e reafirmam sua identidade e origem quilombola.'},
 {id:'p24_29',assuntoId:'filo_estetica',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2024,itemOriginal:29,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'Reforçando a influência da cultura africana, na gravação de "Canto dos Escravos - Canto I" foram utilizados somente instrumentos de percussão de origem africana para acompanhar a melodia, não havendo qualquer instrumento melódico ou harmônico.',gab:'C',res:'Correto: o registro de Clementina de Jesus resgata cantos de trabalho de tradição afro-brasileira, marcados pela predominância da percussão e da voz, sem acompanhamento de instrumentos melódicos/harmônicos.'},
 {id:'p24_31',assuntoId:'bio_ecologia',tipo:'CE',dif:'medio',diag:false,pas:true,oficial:true,ano:2024,itemOriginal:31,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'A diversidade de hábitats dentro do cerrado contribui para a presença de uma ampla gama de espécies vegetais, especialmente árvores cujas copas formam uma cobertura contínua e fechada, característica típica da formação savânica encontrada no cerrado.',gab:'E',res:'Errado: o cerrado é uma savana de dossel aberto, com árvores espaçadas e copas descontínuas — cobertura fechada e contínua é característica de floresta, não do cerrado.'},
 {id:'p24_32',assuntoId:'bio_ecologia',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2024,itemOriginal:32,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'A maioria das espécies vegetais e animais do bioma cerrado pode ser encontrada também em outros biomas, como a Amazônia, pois o desmatamento do Cerrado possibilitou que grande número de espécies, principalmente as arbóreas, se dispersassem pelos diferentes biomas.',gab:'E',res:'Errado: o Cerrado tem altíssimo grau de endemismo (espécies exclusivas); além disso, não é o desmatamento que "dispersa" espécies entre biomas — a premissa é logicamente e biologicamente equivocada.'},
 {id:'p24_33',assuntoId:'geo_raciocinio',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2024,itemOriginal:33,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'A topografia acidentada da Chapada dos Veadeiros constitui uma barreira natural que dificulta a agricultura extensiva e limita a ocupação humana em larga escala, o que favorece a preservação ambiental.',gab:'C',res:'Correto: o relevo acidentado da Chapada dos Veadeiros dificulta o uso agrícola intensivo, contribuindo para a manutenção de áreas preservadas na região.'},
 {id:'p24_34',assuntoId:'geo_economia',tipo:'CE',dif:'medio',diag:false,pas:true,oficial:true,ano:2024,itemOriginal:34,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'Devido ao baixo nível de desenvolvimento econômico da região da Chapada dos Veadeiros, sua exploração econômica pouco afeta o meio ambiente.',gab:'E',res:'Errado: mesmo atividades econômicas pouco intensas (garimpo informal, expansão agropecuária, turismo desordenado) podem causar impactos ambientais relevantes — a premissa liga erroneamente "pouco desenvolvimento" a "pouco impacto".'},
 {id:'p24_35',assuntoId:'geo_raciocinio',tipo:'CE',dif:'dificil',diag:false,pas:true,oficial:true,ano:2024,itemOriginal:35,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'As chapadas são um tipo de relevo que acumula grande quantidade de sedimentos erodidos provenientes de áreas de maior altitude e transportados, geralmente, pelas águas dos rios.',gab:'E',res:'Errado: chapadas são superfícies planas e elevadas, tipicamente resultantes de processos erosivos (relevo residual), e não áreas de acúmulo de sedimentos vindos de regiões mais altas, como sugere o item.'},
 {id:'p24_36',assuntoId:'bio_ecologia',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2024,itemOriginal:36,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'O cerrado quase desapareceu durante o século XX principalmente devido à atividade madeireira, pois a madeira das árvores desse bioma é muito utilizada na fabricação de móveis, por ter alta durabilidade.',gab:'E',res:'Errado: o principal motor da devastação do Cerrado no século XX foi a expansão da fronteira agropecuária (soja, pecuária), não a atividade madeireira.'},
 {id:'p24_37',assuntoId:'bio_ecologia',tipo:'MC',dif:'dificil',diag:false,pas:true,oficial:true,ano:2024,itemOriginal:37,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'Toxinas Cry e Vip do agente biológico Bacillus thuringiensis (Bt) se ligam a diferentes regiões do intestino de larvas de Spodoptera albula e causam sua morte, controlando essa praga agrícola. A interação ecológica envolvida nesse controle, conforme os efeitos provocados pelas toxinas, é denominada:',opts:['parasitismo','predatismo','mutualismo','amensalismo'],gab:3,res:'A relação em que uma população (as larvas) é prejudicada pela ação de substâncias produzidas por outro organismo (a bactéria), sem que esta obtenha benefício direto nesse processo de biocontrole, é classificada como amensalismo.'},
 {id:'p24_39',assuntoId:'geo_raciocinio',tipo:'CE',dif:'facil',diag:false,oficial:true,ano:2024,itemOriginal:39,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'A distribuição de chuvas em Manaus (AM), concentrada ao longo de praticamente todo o ano, é característica de clima equatorial.',gab:'C',res:'Correto: o clima equatorial, típico da região amazônica onde está Manaus, apresenta chuvas abundantes e bem distribuídas ao longo do ano, sem estação seca definida.'},
 {id:'p24_40',assuntoId:'geo_raciocinio',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2024,itemOriginal:40,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'A expressiva sazonalidade mostrada no climograma referente a Formosa (GO), com ritmo anual de chuvas bem definido (um período chuvoso e um seco), é evidência da tropicalidade do clima na região.',gab:'C',res:'Correto: a alternância nítida entre estação chuvosa e seca é a marca do clima tropical típico do Brasil central, diferente da distribuição mais constante do clima equatorial.'},
 {id:'p24_41',assuntoId:'geo_economia',tipo:'MC',dif:'medio',diag:false,oficial:true,ano:2024,itemOriginal:41,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'A respeito do papel dos diferentes gases envolvidos no efeito estufa, assinale a opção correta.',opts:['O dióxido de carbono (CO₂) é um gás de efeito estufa proveniente, principalmente, do uso de fertilizantes nitrogenados.','Os gases fluorados, como o CFC, são extremamente eficazes na retenção de calor e, embora permaneçam pouco tempo na atmosfera, o calor por eles retido pode ser convertido em energia elétrica.','O metano (CH₄) é um gás muito eficiente em reter calor na atmosfera, sendo a pecuária uma das principais atividades emissoras desse gás.','O óxido nitroso (N₂O) é liberado durante a fabricação de aerossóis e sua capacidade de reter calor permite seu emprego em baterias para geração de energia elétrica.'],gab:2,res:'O metano tem alto potencial de retenção de calor por molécula e a pecuária (fermentação entérica do gado) é uma de suas principais fontes emissoras — as demais opções misturam conceitos de forma incorreta.'},
 {id:'p24_42',assuntoId:'geo_urbanizacao',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2024,itemOriginal:42,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'A Revolução Industrial alterou tanto o modo de produção artesanal na Inglaterra a partir do final do século XVIII, quando maquinário movido a combustíveis fósseis passou a ser utilizado no processo produtivo, como impactou negativamente as relações de trabalho, razão pela qual os trabalhadores criaram novas formas de associação e de resistência.',gab:'C',res:'Correto: a Revolução Industrial substituiu a produção artesanal pela fabril mecanizada e piorou as condições de trabalho, o que impulsionou o surgimento de associações operárias e movimentos de resistência.'},
 {id:'p24_43',assuntoId:'filo_estetica',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2024,itemOriginal:43,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'Apesar de a arte medieval estar principalmente fundamentada na arte sacra, a peça musical "Jeu de Robin et Marion", de Adam de la Halle, é de caráter secular.',gab:'C',res:'Correto: mesmo em um período dominado pela arte religiosa, existiu também a arte profana (secular) na Idade Média — a obra de Adam de la Halle é um exemplo de tema não religioso, sobre amor pastoril.'},
 {id:'p24_44',assuntoId:'filo_estetica',tipo:'CE',dif:'facil',diag:false,oficial:true,ano:2024,itemOriginal:44,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'A estrutura arquitetônica das catedrais góticas, seus vitrais e sua decoração escultórica, ao ilustrarem passagens bíblicas, cumpriam uma função de educação religiosa, na medida em que possibilitavam a instrução dos fiéis, em sua maioria analfabetos, por meio de elementos visuais.',gab:'C',res:'Correto: em uma época de alto analfabetismo, a arte sacra (vitrais, esculturas) funcionava como uma "Bíblia visual", ensinando passagens religiosas à população por meio de imagens.'},
 {id:'p24_45',assuntoId:'hist_poder',tipo:'CE',dif:'dificil',diag:false,pas:true,oficial:true,ano:2024,itemOriginal:45,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'Na França e na Inglaterra, desde a era medieval até parte da era moderna, havia a crença de que os reis tinham poder de cura por meio do toque, porém essa crença não era uma das fontes legitimadoras dos poderes reais.',gab:'E',res:'Errado: pelo contrário — a crença no poder taumatúrgico (de cura) do rei era justamente uma das fontes de legitimação sagrada da monarquia, reforçando a ideia de um poder de origem divina.'},
 {id:'p24_53',assuntoId:'port_variacao',tipo:'CE',dif:'facil',diag:false,oficial:true,ano:2024,itemOriginal:53,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'No fragmento da peça "A Pena e a Lei", de Ariano Suassuna, o emprego dos adjetivos "sabido" e "besta" na fala de um dos personagens remete a um registro coloquial da língua portuguesa.',gab:'C',res:'Correto: "sabido" e "besta" nesses sentidos (esperto/tolo) são usos populares e coloquiais, típicos da fala regional nordestina reproduzida na peça.'},
 {id:'p24_54',assuntoId:'lit_generos',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2024,itemOriginal:54,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'Embora os trechos apresentados (de "Antígona" e de "A Pena e a Lei") integrem peças teatrais, caracterizadas como textos escritos para ser encenados, apenas "Antígona" é obra do gênero literário dramático.',gab:'E',res:'Errado: ambas as obras — "Antígona" (tragédia grega) e "A Pena e a Lei" (farsa brasileira) — pertencem ao gênero dramático, escrito para representação teatral.'},
 {id:'p24_56',assuntoId:'lit_generos',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2024,itemOriginal:56,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'A obra "Antígona", de Sófocles, é uma tragédia escrita na Grécia Antiga, ao passo que "A Pena e a Lei", de Ariano Suassuna, é uma farsa brasileira, inspirada na tradição do teatro medieval e escrita no século XX.',gab:'C',res:'Correto: "Antígona" é uma tragédia clássica grega (século V a.C.), enquanto "A Pena e a Lei" é uma farsa moderna brasileira (Movimento Armorial) que dialoga com a tradição cômica popular de origem medieval.'},
 {id:'p24_57',assuntoId:'lit_generos',tipo:'CE',dif:'facil',diag:false,oficial:true,ano:2024,itemOriginal:57,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'O mamulengo, mencionado em "A Pena e a Lei", é um tipo de teatro popular de bonecos típico da região Nordeste do Brasil e caracterizado por gestos mecanizados e rápidos.',gab:'C',res:'Correto: o mamulengo é uma tradição de teatro de bonecos/fantoches popular do Nordeste brasileiro, com movimentos característicos rápidos e marcados.'},
 {id:'p24_62',assuntoId:'socio_desigualdades',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2024,itemOriginal:62,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'A diminuição das distâncias sociais torna-se visível e cômica em "A Pena e a Lei" quando os personagens subalternos chamam os poderosos por apelidos, como Vicente Borrote e Cabo Rosinha.',gab:'C',res:'Correto: o uso de apelidos jocosos para autoridades é um recurso cômico que aproxima ("diminui a distância") entre personagens de diferentes posições sociais na peça.'},
 {id:'p24_63',assuntoId:'socio_marcadores',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2024,itemOriginal:63,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'Em "A Pena e a Lei", a questão racial aparece, entre outras passagens, na representação de Benedito, personagem negro que é retratado de forma positiva e que demonstra ser mais esperto que os dois valentões da cidade.',gab:'C',res:'Correto: a peça de Suassuna traz a representação positiva de um personagem negro (Benedito), associando-o à esperteza popular em contraste com figuras de poder — traço de valorização cultural do Movimento Armorial.'},
 {id:'p24_64',assuntoId:'bio_bioquimica',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2024,itemOriginal:64,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'Na fabricação de pão, o crescimento da massa deve-se à ação do dióxido de carbono liberado durante a fermentação alcoólica.',gab:'C',res:'Correto: as leveduras realizam fermentação alcoólica, liberando CO₂, cujas bolhas ficam presas na rede de glúten e fazem a massa crescer.'},
 {id:'p24_65',assuntoId:'bio_bioquimica',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2024,itemOriginal:65,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'Na produção de vinho, a fermentação alcoólica é realizada por bactérias aeróbicas, que convertem os açúcares das uvas produzindo 38 moléculas de ATP.',gab:'E',res:'Errado: a fermentação alcoólica é realizada por leveduras (fungos), não bactérias, é um processo anaeróbico, e seu rendimento energético é bem menor que 38 ATP (valor da respiração aeróbica completa da glicose).'},
 {id:'p24_67',assuntoId:'port_morfo',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2024,itemOriginal:67,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'No poema "Vamos, irmã, vamos dormir", de Fernando Esquio, é opcional o emprego do acento indicativo de crase no vocábulo "as" em ambas as suas ocorrências.',gab:'E',res:'Errado: a crase não é uma opção estilística livre — seu uso segue regras gramaticais específicas (fusão da preposição "a" com artigo/pronome "a(s)"), não sendo "opcional" nas ocorrências do poema.'},
 {id:'p24_68',assuntoId:'filo_estetica',tipo:'CE',dif:'facil',diag:false,oficial:true,ano:2024,itemOriginal:68,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'A xilogravura é uma técnica artística popular de reprodução de imagens e textos a partir de uma matriz de madeira entalhada cujas partes em relevo são entintadas para impressão sobre papel, à maneira de um carimbo.',gab:'C',res:'Correto: essa é a técnica da xilogravura — muito usada na arte popular nordestina, como nas obras de J. Borges — em que o relevo entalhado na madeira recebe tinta e é impresso no papel.'},
 {id:'p24_69',assuntoId:'filo_estetica',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2024,itemOriginal:69,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'Na literatura de cordel, devido à técnica artística empregada (a xilogravura), cada folheto é único, não podendo ser reproduzido em série.',gab:'E',res:'Errado: a xilogravura é justamente uma técnica de reprodução — a matriz de madeira permite imprimir a mesma imagem/texto muitas vezes, possibilitando a produção em série dos folhetos de cordel, e não peças únicas.'},
 {id:'p24_70',assuntoId:'lit_trovador',tipo:'CE',dif:'dificil',diag:false,pas:true,oficial:true,ano:2024,itemOriginal:70,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'No contexto histórico de produção do texto "Vamos, irmã, vamos dormir", de Fernando Esquio, a voz feminina, que predomina nas cantigas de amigo, é parte de um movimento de afirmação das mulheres como escritoras no meio literário medieval.',gab:'E',res:'Errado: as cantigas de amigo eram compostas por trovadores homens que adotavam uma voz lírica feminina — não refletem um movimento histórico de mulheres escritoras, mas sim uma convenção poética masculina da época.'},
 {id:'p24_71',assuntoId:'lit_trovador',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2024,itemOriginal:71,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'No poema "Vamos, irmã, vamos dormir", identifica-se a repetição da estrutura das frases em paralelo, o que é uma característica recorrente na composição das cantigas de amigo.',gab:'C',res:'Correto: o paralelismo (repetição de estruturas sintáticas entre estrofes, com pequenas variações) é um recurso típico e recorrente da lírica trovadoresca galego-portuguesa, especialmente nas cantigas de amigo.'},
 {id:'p24_75',assuntoId:'filo_correntes',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2024,itemOriginal:75,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'As lições de Epicteto são baseadas na vida cotidiana durante a Antiguidade grega e tratam de aspectos superficiais das ações humanas nesse contexto histórico, portanto são inaplicáveis à problematização filosófica do sentido da vida nos dias atuais.',gab:'E',res:'Errado: os ensinamentos estoicos de Epicteto tratam de questões éticas profundas (o que está ou não sob nosso controle) e continuam amplamente aplicáveis e discutidos na reflexão filosófica contemporânea.'},
 {id:'p24_76',assuntoId:'lit_barroco',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2024,itemOriginal:76,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'No "Sermão de Santo Antônio aos Peixes", Padre Antônio Vieira dirige-se aos peixes como estratégia para reforçar seu argumento de que os fiéis estão indiferentes à exploração que os colonos promovem na região, o que constituiria, segundo o pregador, violação dos princípios cristãos.',gab:'C',res:'Correto: Vieira usa a crítica indireta aos peixes (que "se comem uns aos outros") como estratégia retórica para denunciar, por analogia, a exploração e a ganância entre os próprios homens, contrária aos princípios cristãos.'},
 {id:'p24_77',assuntoId:'lit_barroco',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2024,itemOriginal:77,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'No "Sermão de Santo Antônio aos Peixes", a comparação dos seres humanos a peixes ressalta a inocência dos primeiros em relação aos atos violentos que possam ter praticado.',gab:'E',res:'Errado: a comparação tem efeito justamente oposto — reforça a crítica à ganância e à violência humana ("os grandes comem os pequenos"), não sua inocência.'},
 {id:'p24_81',assuntoId:'socio_desigualdades',tipo:'CE',dif:'facil',diag:false,oficial:true,ano:2024,itemOriginal:81,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'Um índice de Gini próximo de zero indica menos desigualdade social na população.',gab:'C',res:'Correto: o índice de Gini varia de 0 (igualdade perfeita de renda) a 1 (desigualdade máxima) — quanto mais próximo de zero, menor a desigualdade.'},
 {id:'p24_82',assuntoId:'bio_metodo',tipo:'CE',dif:'facil',diag:false,oficial:true,ano:2024,itemOriginal:82,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'A teoria da panspermia cósmica propõe que a vida na Terra se originou por um processo exógeno, com a chegada de componentes essenciais à Terra a partir do espaço, transportados por meteoritos ou cometas.',gab:'C',res:'Correto: essa é justamente a proposta central da panspermia — que compostos ou formas de vida vieram do espaço, diferente da hipótese de que a vida tenha surgido espontaneamente nos oceanos terrestres.'},
 {id:'p24_83',assuntoId:'bio_metodo',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2024,itemOriginal:83,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'Os experimentos desenvolvidos por Miller-Urey, que simulavam as condições da atmosfera primitiva, evidenciaram a formação de aminoácidos, substâncias formadas pela combinação básica de hidrogênio, carbono, nitrogênio e oxigênio, além de outros átomos menos frequentes.',gab:'C',res:'Correto: o experimento de Miller-Urey (1953) demonstrou que, a partir de gases simples e descargas elétricas simulando relâmpagos, é possível formar aminoácidos — apoiando a hipótese da evolução química da vida.'},
 {id:'p24_84',assuntoId:'quim_ligacoes',tipo:'CE',dif:'dificil',diag:false,pas:true,oficial:true,ano:2024,itemOriginal:84,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'O ângulo de ligação entre os átomos de hidrogênio e o átomo central é maior na amônia (NH₃) do que na fosfina (PH₃).',gab:'C',res:'Correto: o nitrogênio (na amônia) é menor e mais eletronegativo que o fósforo (na fosfina), gerando maior repulsão entre os pares de elétrons ligantes e um ângulo de ligação maior na amônia (~107°) do que na fosfina (~93°).'},
 {id:'p24_85',assuntoId:'quim_ligacoes',tipo:'CE',dif:'dificil',diag:false,pas:true,oficial:true,ano:2024,itemOriginal:85,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'De acordo com a classificação dos compostos hidretos, CaH₂, PH₃ e SiH₄ são todos compostos covalentes.',gab:'E',res:'Errado: o CaH₂ é um hidreto iônico/salino (cálcio é um metal alcalino-terroso que forma ligação iônica com o hidrogênio); já PH₃ e SiH₄ são de fato covalentes, formados entre ametal/semimetal e hidrogênio.'},
 {id:'p24_86',assuntoId:'quim_ligacoes',tipo:'CE',dif:'dificil',diag:false,pas:true,oficial:true,ano:2024,itemOriginal:86,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'Em termos de energia de dissociação das ligações entre o hidrogênio e os elementos do grupo 15 da Tabela Periódica, a fosfina (PH₃) é um composto mais estável do que a amônia (NH₃).',gab:'E',res:'Errado: a ligação N–H é mais forte (maior energia de dissociação) do que a ligação P–H, tornando a amônia mais estável que a fosfina, e não o contrário.'},
 {id:'p24_99',assuntoId:'quim_atomica',tipo:'CE',dif:'dificil',diag:false,pas:true,oficial:true,ano:2024,itemOriginal:99,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'Considerando-se os elementos/íons Ca²⁺, K⁺, P³⁻ e Cl⁻, a ordem decrescente do raio iônico é: P³⁻ > Cl⁻ > K⁺ > Ca²⁺.',gab:'C',res:'Correto: esses quatro íons são isoeletrônicos (mesmo número de elétrons), e nesse caso o raio iônico diminui conforme aumenta a carga nuclear — por isso o ânion mais "negativo" (P³⁻) é o maior, e o cátion mais "positivo" (Ca²⁺) é o menor.'},
 {id:'p24_100',assuntoId:'quim_conservacao',tipo:'CE',dif:'dificil',diag:false,pas:true,oficial:true,ano:2024,itemOriginal:100,fonte:'PAS 1 — Subprograma 2024, Cebraspe/UnB',enun:'Na reação Ca(OH)₂(s) + CO₂(g) → CaCO₃(s) + H₂O(l), se em uma embalagem de kimchi for gerado um excesso de 1.100 mg de CO₂, será necessária uma quantidade de Ca(OH)₂ superior a 2 gramas para consumir o gás carbônico gerado.',gab:'E',res:'Errado: 1.100 mg = 1,1 g de CO₂ ÷ 44 g/mol ≈ 0,025 mol. Pela estequiometria 1:1 da reação, são necessários 0,025 mol de Ca(OH)₂ × 74 g/mol ≈ 1,85 g — quantidade inferior, não superior, a 2 gramas.'},
];

function redacaoTemaSemana(){
  const dow = (new Date().getDay()+6)%7;
  const monday = new Date(); monday.setDate(monday.getDate()-dow); monday.setHours(0,0,0,0);
  const weekKey = monday.toISOString().slice(0,10);
  const idx = hashStr(weekKey) % REDACAO_TEMAS.length;
  return REDACAO_TEMAS[idx];
}
function getRedacaoTema(id){ return REDACAO_TEMAS.find(t=>t.id===id) || redacaoTemaSemana(); }
function redacaoEntries(){ return (STATE.redacao && STATE.redacao.entries) || []; }
function competenciaTotal(entry){
  if(!entry || !entry.competencias) return 0;
  return REDACAO_COMPETENCIAS.reduce((s,c)=>s+(entry.competencias[c.key]||0),0); // máx 20 (5 competências x 0-4)
}
function competenciaLabel(total){
  if(total>=17) return {label:'Muito bom domínio', cls:'b-green'};
  if(total>=12) return {label:'Bom domínio', cls:'b-yellow'};
  if(total>=6) return {label:'Em desenvolvimento', cls:'b-orange'};
  return {label:'Iniciante', cls:'b-red'};
}
function redacaoStats(){
  const entries = redacaoEntries();
  const corrigidas = entries.filter(e=>e.corrigida);
  const mediaCompetencia = corrigidas.length ? Math.round(corrigidas.reduce((s,e)=>s+competenciaTotal(e),0)/corrigidas.length*10)/10 : null;
  const tempoMedio = entries.length ? Math.round(entries.reduce((s,e)=>s+(e.tempoSeg||0),0)/entries.length/60) : 0;
  const catFreq = {};
  entries.forEach(e=>(e.categorias||[]).forEach(c=>catFreq[c]=(catFreq[c]||0)+1));
  const topCat = Object.entries(catFreq).sort((a,b)=>b[1]-a[1])[0];
  return {total:entries.length, corrigidasCount:corrigidas.length, mediaCompetencia, tempoMedio, catFreq, topCat: topCat? topCat[0] : null};
}

function load(){
  try{

    const parsed = JSON.parse(raw);

    const defDiagnostic = def.diagnostic, defProfile = def.profile, defAppearance = def.appearance, defRedacao = def.redacao; // guarda os defaults antes do Object.assign raso sobrescrever

  const a = STATE.activity[d];
  Object.keys(patch).forEach(k=>{ a[k] = (a[k]||0) + patch[k]; });

function snapshotHistory(){
  const totalQ = Object.values(STATE.qStats).reduce((s,q)=>s+q.seen,0);
  if(!totalQ) return; // nada praticado ainda — não fabrica ponto de histórico
  const totalCorrect = Object.values(STATE.qStats).reduce((s,q)=>s+q.correct,0);
  const acc = Math.round(totalCorrect/totalQ*100);
  const green = ASSUNTOS.filter(a=>contentFor(a.id).status==='green').length;
  const dominio = Math.round(green/ASSUNTOS.length*100);
  const today = todayISO();
  const last = STATE.history[STATE.history.length-1];
  if(last && last.date===today){ last.accuracy=acc; last.dominio=dominio; }
  else { STATE.history.push({date:today, accuracy:acc, dominio}); }
}
