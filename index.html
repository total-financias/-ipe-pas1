<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ipê PAS1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF7EE; --surface:#FFFFFF; --surface-2:#F2EAD3; --border:#E3D6B4;
  --ink:#20281F; --ink-soft:#4B5245; --muted:#8A8267;
  --accent:#2F6E4F; --accent-strong:#1F5138; --accent-ink:#F6FBF3;
  --accent-2:#D9642A; --accent-2-ink:#FFF6EF;
  --red:#C1442A; --red-bg:#FBE7E1; --orange:#DE8A2E; --orange-bg:#FBEEDA;
  --yellow:#C9A227; --yellow-bg:#FAF3D6; --green:#2F8F5B; --green-bg:#E4F3EA;
  --shadow: 0 1px 2px rgba(32,40,31,.06), 0 6px 20px -8px rgba(32,40,31,.18);
  --radius:16px; --radius-sm:10px;
  --font-display:'Fraunces',Georgia,serif; --font-body:'Manrope',system-ui,sans-serif; --font-mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12160F; --surface:#1A2018; --surface-2:#222A1D; --border:#333B2B;
    --ink:#ECE7D8; --ink-soft:#C6C2AC; --muted:#8D9184;
    --accent:#5FBE8B; --accent-strong:#7ED3A5; --accent-ink:#0E1A13;
    --accent-2:#F0925B; --accent-2-ink:#2A1408;
    --red:#F0897A; --red-bg:#3A1E17; --orange:#F0B26B; --orange-bg:#3A2C13;
    --yellow:#E3CE6E; --yellow-bg:#38310F; --green:#7ED3A5; --green-bg:#173322;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -10px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#12160F; --surface:#1A2018; --surface-2:#222A1D; --border:#333B2B;
  --ink:#ECE7D8; --ink-soft:#C6C2AC; --muted:#8D9184;
  --accent:#5FBE8B; --accent-strong:#7ED3A5; --accent-ink:#0E1A13;
  --accent-2:#F0925B; --accent-2-ink:#2A1408;
  --red:#F0897A; --red-bg:#3A1E17; --orange:#F0B26B; --orange-bg:#3A2C13;
  --yellow:#E3CE6E; --yellow-bg:#38310F; --green:#7ED3A5; --green-bg:#173322;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -10px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.5;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:var(--font-display);font-weight:600;text-wrap:balance;margin:0 0 .3em;}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
a{color:inherit;}
button{font-family:var(--font-body);cursor:pointer;}
::selection{background:var(--accent);color:var(--accent-ink);}

#app{max-width:900px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

/* header */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 10px;}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:700;font-size:1.05rem;}
.brand-mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(155deg,var(--accent),var(--accent-strong));display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.stat-pills{display:flex;gap:8px;align-items:center;}
.pill{display:flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--border);padding:5px 10px;border-radius:100px;font-size:.78rem;font-weight:600;color:var(--ink-soft);white-space:nowrap;}
.pill b{color:var(--ink);font-family:var(--font-mono);}
.pill.days{background:var(--accent);color:var(--accent-ink);border-color:transparent;}
.pill.days b{color:var(--accent-ink);}

.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:100px;border:1px solid transparent;background:transparent;color:var(--muted);font-weight:600;font-size:.85rem;}
.tab.active{background:var(--surface-2);color:var(--ink);border-color:var(--border);}
.tab:hover:not(.active){color:var(--ink-soft);}

main{flex:1;padding:18px 16px 90px;}
.view{display:flex;flex-direction:column;gap:16px;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
.card-flat{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.row{display:flex;gap:10px;align-items:center;}
.row-between{display:flex;gap:10px;align-items:center;justify-content:space-between;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:560px){.grid2{grid-template-columns:1fr;}}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media(max-width:640px){.grid3{grid-template-columns:1fr 1fr;}}

.btn{display:inline-flex;align-items:center;gap:6px;justify-content:center;padding:10px 16px;border-radius:100px;border:none;font-weight:700;font-size:.88rem;transition:transform .1s;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--accent);color:var(--accent-ink);}
.btn-secondary{background:var(--surface-2);color:var(--ink);border:1px solid var(--border);}
.btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--border);}
.btn-warn{background:var(--accent-2);color:var(--accent-2-ink);}
.btn-sm{padding:6px 12px;font-size:.78rem;}
.btn:disabled{opacity:.4;cursor:default;}
.btn-block{width:100%;}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:100px;font-size:.72rem;font-weight:700;letter-spacing:.02em;}
.b-red{background:var(--red-bg);color:var(--red);} .b-orange{background:var(--orange-bg);color:var(--orange);}
.b-yellow{background:var(--yellow-bg);color:var(--yellow);} .b-green{background:var(--green-bg);color:var(--green);}
.b-neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--border);}

.status-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.dot-red{background:var(--red);} .dot-orange{background:var(--orange);} .dot-yellow{background:var(--yellow);} .dot-green{background:var(--green);}

.bar{height:8px;border-radius:100px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border);}
.bar > div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-strong));border-radius:100px;transition:width .4s;}

.label-eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}

.task{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--border);}
.task:last-child{border-bottom:none;}
.task-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;background:var(--surface-2);}
.task-body{flex:1;min-width:0;}
.task-title{font-weight:700;font-size:.92rem;}
.task-sub{font-size:.78rem;color:var(--muted);}
.task.done .task-title{text-decoration:line-through;color:var(--muted);}
.task.done .task-icon{background:var(--green-bg);color:var(--green);}

.qcard{display:flex;flex-direction:column;gap:14px;}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;}
.qstatement{font-size:1.02rem;line-height:1.55;}
.opt{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface);font-weight:600;font-size:.92rem;text-align:left;}
.opt:hover{border-color:var(--accent);}
.opt.correct{border-color:var(--green);background:var(--green-bg);color:var(--green);}
.opt.wrong{border-color:var(--red);background:var(--red-bg);color:var(--red);}
.opt-row{display:flex;gap:10px;}
.opt-row .opt{flex:1;}

.chip-input{width:100%;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--ink);font-family:var(--font-body);font-size:.88rem;}
select.chip-input{appearance:none;}
textarea.chip-input{resize:vertical;min-height:64px;}

.tree-materia{margin-bottom:6px;}
.tree-materia > summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;padding:11px 4px;font-weight:700;font-size:.94rem;}
.tree-materia > summary::-webkit-details-marker{display:none;}
.tree-materia[open] > summary{color:var(--accent);}
.assunto-row{display:flex;align-items:center;gap:10px;padding:9px 4px 9px 14px;border-top:1px solid var(--border);font-size:.86rem;}
.assunto-row .name{flex:1;}
.assunto-row .hab{font-size:.7rem;color:var(--muted);font-family:var(--font-mono);}

.section-title{display:flex;align-items:center;gap:8px;}
.section-title h2{margin:0;font-size:1.15rem;}

.empty{text-align:center;padding:30px 10px;color:var(--muted);}

.footer-note{font-size:.74rem;color:var(--muted);line-height:1.6;padding:10px 4px 40px;}
.footer-note a{color:var(--accent);}

.timer{font-family:var(--font-mono);font-weight:700;font-size:1.4rem;}

.sparkline{display:flex;align-items:flex-end;gap:5px;height:70px;}
.spark-bar{flex:1;background:var(--surface-2);border-radius:4px 4px 0 0;position:relative;min-height:4px;}
.spark-bar > div{position:absolute;bottom:0;left:0;right:0;background:var(--accent);border-radius:4px 4px 0 0;}

.obra-card{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;background:var(--surface);}
.obra-cat{font-size:.68rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--accent-2);}

.modal-bg{position:fixed;inset:0;background:rgba(20,24,17,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0;}
@media(min-width:640px){.modal-bg{align-items:center;}}
.modal{background:var(--surface);border-radius:20px 20px 0 0;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;padding:22px;box-shadow:var(--shadow);}
@media(min-width:640px){.modal{border-radius:20px;}}

.gauge-wrap{display:flex;align-items:center;gap:14px;}
.check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}

.time-choice{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.time-choice button{padding:12px 6px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface);font-weight:700;font-size:.85rem;}
.time-choice button.sel{border-color:var(--accent);background:var(--green-bg);color:var(--accent-strong);}

/* ---- Fase 1: design tokens, tipografia, hierarquia de botões, confiança/motivo, status oficial ---- */
:root{ --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px; --radius-lg:22px; }
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
}
.title-lg{font-family:var(--font-display);font-weight:700;font-size:1.55rem;line-height:1.18;margin:0 0 4px;}
.title-md{font-family:var(--font-display);font-weight:700;font-size:1.22rem;line-height:1.22;margin:0 0 4px;}
.subtitle{font-size:.88rem;color:var(--ink-soft);line-height:1.5;}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid transparent;}
.btn-danger:hover{background:var(--red);color:#fff;}
.card{transition:border-color .15s,box-shadow .15s;}
.card:hover{border-color:var(--muted);}
.opt:focus-visible,.btn:focus-visible,.tab:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.confidence-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.confidence-row button{padding:12px 6px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface);font-weight:700;font-size:.8rem;display:flex;flex-direction:column;align-items:center;gap:4px;}
.confidence-row button:hover{border-color:var(--accent);}
.confidence-row button span.emoji{font-size:1.3rem;}
.motivo-chips{display:flex;flex-wrap:wrap;gap:6px;}
.motivo-chips button{padding:7px 12px;border-radius:100px;border:1.5px solid var(--border);background:var(--surface);font-weight:600;font-size:.8rem;}
.motivo-chips button.sel{border-color:var(--accent);background:var(--green-bg);color:var(--accent-strong);}
.status-official{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:100px;margin:2px 4px 2px 0;}
.status-official.ok{background:var(--green-bg);color:var(--green);}
.status-official.pending{background:var(--yellow-bg);color:var(--yellow);}
.status-official.historic{background:var(--surface-2);color:var(--muted);border:1px solid var(--border);}
.mission-cta{display:flex;align-items:center;justify-content:center;gap:8px;font-size:1rem;padding:14px 18px;}
.banner-info{border-left:3px solid var(--accent);background:var(--surface-2);border-radius:var(--radius-sm);padding:10px 12px;font-size:.85rem;}
.priority-flag{font-size:.85rem;line-height:1;flex-shrink:0;}

hr{border:none;border-top:1px solid var(--border);margin:2px 0;}
</style>
</head>

 {id:'p23_16',assuntoId:'mat_conjuntos',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2023,itemOriginal:16,fonte:'PAS 1 — Subprograma 2023 (triênio 2023/2025), Cebraspe/UnB, aplicado em 03/12/2023',enun:'Um texto sobre o Cerrado brasileiro afirma que esse bioma detém "5% das espécies de todo o planeta e 30% da biodiversidade nacional". Considerando essa informação, é correto concluir que as espécies do Brasil correspondem a 3/20 das espécies da Terra.',gab:'E',res:'Se o Cerrado tem 5% das espécies do planeta e isso equivale a 30% da biodiversidade brasileira, o total do Brasil é 5%/0,30 ≈ 16,67% (1/6) das espécies da Terra — não 3/20 (15%). Um clássico erro de regra de três.'},
 {id:'p23_20',assuntoId:'mat_quadratica',tipo:'CE',dif:'dificil',diag:false,pas:true,oficial:true,ano:2023,itemOriginal:20,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Tabela de produção anual de um pequizeiro entre 10 e 15 anos após o plantio: 10→80, 11→117, 12→152, 13→185, 14→216, 15→245 frutos. Considere que a produção seja dada por Q(t) = -2t² + 108t - 576, para 10 ≤ t ≤ 45. No ano de maior produtividade, o pequizeiro produziu mais de 800 frutos.',gab:'C',res:'Vértice da parábola: t = -b/(2a) = -108/(-4) = 27 (dentro do domínio). Q(27) = -2(729)+108(27)-576 = -1458+2916-576 = 882 > 800. Correto.'},
 {id:'p23_21',assuntoId:'mat_quadratica',tipo:'CE',dif:'dificil',diag:false,pas:true,oficial:true,ano:2023,itemOriginal:21,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Ainda sobre o pequizeiro (10→80 frutos, 11→117, ...): se a função Q(t) = -t² + bt - 400 também representasse essa produção, o valor de b deveria ser superior a 80.',gab:'E',res:'Usando t=10, Q(10)=80: -100+10b-400=80 → 10b=580 → b=58. Como 58 não é superior a 80, o item está errado.'},
 {id:'p23_43',assuntoId:'mat_cartesiano',tipo:'NUM',dif:'medio',diag:false,oficial:true,ano:2023,itemOriginal:43,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'A obra "A última ceia", de Leonardo da Vinci, mede 4,60 m de altura por 8,80 m de largura. Uma reprodução mantém a mesma proporção e tem largura de 22 cm. Calcule, em cm², a área da reprodução (despreze a parte fracionária).',gab:253,res:'Altura da reprodução = 22 × (4,60/8,80) = 11,5 cm. Área = 22 × 11,5 = 253 cm².'},
 {id:'p23_90',assuntoId:'mat_conjuntos',tipo:'NUM',dif:'dificil',diag:false,pas:true,oficial:true,ano:2023,itemOriginal:90,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Um relatório da ONU estima que, em 2050, haverá no mundo duas pessoas com mais de 65 anos para cada uma com idade entre 0 e 4 anos. Considere que, em 2050, a população mundial será de 9 bilhões, das quais 10% serão crianças de 0 a 4 anos. Calcule, em dezenas de milhões, a quantidade de pessoas com idade entre 4 e 65 anos (despreze a parte fracionária).',gab:630,res:'Crianças (0–4): 10% de 9 bi = 900 milhões. Pessoas >65: o dobro = 1.800 milhões. Entre 4 e 65: 9.000 − 900 − 1.800 = 6.300 milhões = 630 dezenas de milhões.'},
 {id:'p23_100',assuntoId:'fis_mecanica',tipo:'NUM',dif:'dificil',diag:false,pas:true,oficial:true,ano:2023,itemOriginal:100,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Uma cadeira de rodas motorizada (20 kg), transportando uma pessoa de 120 kg, sobe em 25 s uma rampa com desnível h = 1,50 m. Desconsiderando dissipação de energia e usando g = 10 m/s², calcule, em watts, a potência do motor (despreze a parte fracionária).',gab:84,res:'Energia: E = m·g·h = 140×10×1,5 = 2.100 J. Potência = E/t = 2100/25 = 84 W.'},
 {id:'p23_64',assuntoId:'fis_astro',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2023,itemOriginal:64,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'A teoria sobre a esfericidade da Terra tem origem no pensamento aristotélico, na Grécia antiga, e pôde ser comprovada na contemporaneidade por meio de imagens de satélites e do GPS.',gab:'C',res:'Correto: Aristóteles defendeu a esfericidade da Terra em "Do Céu"; hoje isso é confirmado por satélites e GPS, tecnologias que dependem de um planeta esférico para funcionar.'},
 {id:'p23_67',assuntoId:'fis_mecanica',tipo:'CE',dif:'dificil',diag:false,pas:true,oficial:true,ano:2023,itemOriginal:67,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Somente conhecimentos comprovados por evidências empíricas podem ser considerados científicos; por isso, a teoria de Newton foi completamente descartada quando Einstein reformulou a ideia de espaço-tempo.',gab:'E',res:'Errado: a física newtoniana não foi descartada — continua sendo eficaz para descrever o movimento de corpos no sistema solar e na superfície da Terra; a relatividade só revela seus limites em outras escalas.'},
 {id:'p23_66',assuntoId:'filo_metodo',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2023,itemOriginal:66,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'A despeito do que sugerem os terraplanistas, a impossibilidade de reproduzir o Big Bang em laboratório não deslegitima as teorias científicas sobre a origem do universo.',gab:'C',res:'Correto: a ciência valida teorias também por evidências indiretas e previsões testáveis, não apenas por reprodução direta em laboratório.'},
 {id:'p23_69',assuntoId:'bio_metodo',tipo:'CE',dif:'dificil',diag:false,pas:true,oficial:true,ano:2023,itemOriginal:69,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'A teoria da panspermia cósmica postula que os primeiros seres surgiram nos oceanos e realizavam quimiossíntese a partir de compostos inorgânicos simples.',gab:'E',res:'Errado: a panspermia propõe que a vida (ou seus precursores) veio do espaço — não que tenha surgido nos oceanos terrestres. A descrição do item corresponde a outra hipótese.'},
 {id:'p23_52',assuntoId:'quim_historia',tipo:'CE',dif:'facil',diag:false,oficial:true,ano:2023,itemOriginal:52,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Considere a reação a C6H12O6 → b C2H5OH + c CO2, usada na produção de vinho e de etanol combustível. Técnicas experimentais, como a destilação, contribuíram para o desenvolvimento da química enquanto ciência.',gab:'C',res:'Correto: técnicas de separação e purificação como a destilação foram fundamentais para consolidar o método experimental da química.'},
 {id:'p23_53',assuntoId:'quim_conservacao',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2023,itemOriginal:53,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Sobre a mesma reação de fermentação (glicose → etanol + CO2): o etanol é uma fonte de energia não renovável, e sua produção a partir da cana-de-açúcar é motivada pela redução da poluição e do aquecimento global.',gab:'E',res:'Errado: o etanol de cana-de-açúcar é justamente um exemplo de fonte RENOVÁVEL (a cana pode ser replantada) — parte do motivo de seu uso como alternativa mais limpa.'},
 {id:'p23_54',assuntoId:'quim_ligacoes',tipo:'CE',dif:'dificil',diag:false,pas:true,oficial:true,ano:2023,itemOriginal:54,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'A água gaseificada é obtida a partir da água por adição de gás carbônico sob pressão. Esse processo aumenta a solubilidade do gás carbônico em decorrência de intensas interações intermoleculares.',gab:'C',res:'Correto: sob pressão, mais moléculas de CO2 interagem com as moléculas de água, aumentando sua solubilidade.'},
 {id:'p23_44',assuntoId:'bio_bioquimica',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2023,itemOriginal:44,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Sobre o pão ázimo (assado sem fermento, feito com farinha e água): na sua produção, observa-se um caso de fermentação lática, em que o carboidrato da massa é convertido em CO2 e água.',gab:'E',res:'Errado — pegadinha de leitura: o texto diz que o pão ázimo é feito "sem fermento". Sem fermento, não há fermentação nenhuma acontecendo.'},
 {id:'p23_45',assuntoId:'bio_bioquimica',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2023,itemOriginal:45,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'O vinho é produzido com base em fermentação alcoólica, na qual as bactérias presentes no suco da uva esmagada convertem o açúcar em CO2 e álcool.',gab:'E',res:'Errado: quem realiza a fermentação alcoólica são leveduras (fungos), não bactérias.'},
 {id:'p23_46',assuntoId:'bio_bioquimica',tipo:'CE',dif:'facil',diag:false,oficial:true,ano:2023,itemOriginal:46,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Nos pães feitos com farinha de trigo, o glúten forma uma rede de proteínas que proporciona elasticidade à massa.',gab:'C',res:'Correto: o glúten é formado por proteínas (glutenina e gliadina) que, hidratadas e sovadas, criam uma rede elástica.'},
 {id:'p23_47',assuntoId:'geo_economia',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2023,itemOriginal:47,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'O trigo, matéria-prima do pão e de diversos outros alimentos, é uma commodity, e o Brasil é autossuficiente na sua produção.',gab:'E',res:'Errado: o trigo é de fato uma commodity, mas o Brasil NÃO é autossuficiente — importa parte significativa do que consome.'},
 {id:'p23_55',assuntoId:'filo_correntes',tipo:'CE',dif:'facil',diag:false,oficial:true,ano:2023,itemOriginal:55,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Trecho de "O manual de Epicteto": "É ação de quem não se educou acusar os outros pelas coisas que ele próprio faz erroneamente. De quem começou a se educar, acusar a si próprio. De quem já se educou, não acusar os outros nem a si próprio." A educação pode transformar pessoas e sua postura frente aos próprios erros.',gab:'C',res:'Correto: o trecho descreve três estágios (não educado → começando a se educar → já educado), cada um com postura diferente frente ao erro.'},
 {id:'p23_56',assuntoId:'filo_correntes',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2023,itemOriginal:56,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Sobre o mesmo trecho de Epicteto: seu pensamento faz parte da tradição estoica e seus ensinamentos priorizam a ética.',gab:'C',res:'Correto: Epicteto é um dos principais filósofos estoicos, escola que enfatiza a ética e o autocontrole.'},
 {id:'p23_57',assuntoId:'filo_correntes',tipo:'CE',dif:'dificil',diag:false,pas:true,oficial:true,ano:2023,itemOriginal:57,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Ainda sobre o trecho: quem já se educou acusa a si próprio quando acusa os outros.',gab:'E',res:'Errado — leitura atenta: quem "já se educou" NÃO acusa nem os outros nem a si próprio. O item inventa uma relação que o texto não afirma.'},
 {id:'p23_58',assuntoId:'lit_generos',tipo:'MC',dif:'medio',diag:false,oficial:true,ano:2023,itemOriginal:58,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Na peça Antígona, de Sófocles, Antígona enterra:',opts:['sua irmã, cumprindo as ordens de Édipo, logo não pratica crime algum.','seu pai, contrariando as ordens de Creonte, logo pratica um crime.','sua mãe, cumprindo as ordens de Édipo, logo não pratica crime algum.','seu irmão, contrariando as ordens de Creonte, logo pratica um crime.'],gab:3,res:'Antígona desafia o decreto de Creonte (que proibira sepultar Polinices, tido como traidor) e enterra seu irmão mesmo assim — um ato de desobediência que, pela lei de Creonte, é um crime.'},
 {id:'p23_73',assuntoId:'lit_arcadismo',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2023,itemOriginal:73,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Poema de Cláudio Manoel da Costa: "Torno a ver-vos, ó montes; o destino / Aqui me torna a pôr nestes outeiros [...] Aqui descanse a louca fantasia, / E o que até agora se tornava em pranto / Se converta em afetos de alegria." O poema se organiza com base na expressão poética objetivista, sem expressividade lírica em primeira pessoa.',gab:'E',res:'Errado: o poema é claramente lírico e em primeira pessoa ("Torno a ver-vos", "Aqui estou").'},
 {id:'p23_74',assuntoId:'lit_arcadismo',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2023,itemOriginal:74,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Sobre o mesmo poema: ele se adéqua à estética do Trovadorismo, pela forma como retrata o ambiente natural brasileiro.',gab:'E',res:'Errado: Cláudio Manoel da Costa é autor arcadista, não trovadoresco — o poema usa o bucolismo típico do Arcadismo (vida simples no campo vs. vida na Corte).'},
 {id:'p23_76',assuntoId:'lit_arcadismo',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2023,itemOriginal:76,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Ainda sobre o poema: nele, o sujeito lírico desvaloriza a natureza que por ele mesmo é descrita.',gab:'E',res:'Errado: é o oposto — o eu lírico valoriza a vida simples do campo, dizendo que "o bem desta choupana" vale mais que "da cidade o lisonjeiro encanto".'},
 {id:'p23_77',assuntoId:'lit_arcadismo',tipo:'CE',dif:'facil',diag:false,oficial:true,ano:2023,itemOriginal:77,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Ainda sobre o poema: ele pode ser classificado como um soneto, haja vista seu esquema de rimas, métrica e estrofação.',gab:'C',res:'Correto: o poema tem 14 versos em dois quartetos e dois tercetos — a estrutura clássica do soneto.'},
 {id:'p23_80',assuntoId:'lit_arcadismo',tipo:'MC',dif:'medio',diag:false,oficial:true,ano:2023,itemOriginal:80,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Considerando o estilo de época do poema, os nomes "Almendro" e "Corino" referem-se a:',opts:['personagens mitológicos da Grécia antiga.','montes aos quais o sujeito lírico dirige o seu discurso.','membros da Corte de onde retorna o sujeito lírico.','"companheiros" do sujeito lírico, transfigurados em pastores árcades.'],gab:3,res:'No Arcadismo, o eu lírico assume um pseudônimo pastoril e convive com "companheiros" também transfigurados em pastores — exatamente o caso de Almendro e Corino.'},
 {id:'p23_12',assuntoId:'geo_economia',tipo:'CE',dif:'dificil',diag:false,pas:true,oficial:true,ano:2023,itemOriginal:12,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Os latossolos (solos avermelhados) do bioma Cerrado são ricos em nutrientes, o que garante sua fertilidade e proporciona êxito na produção agropecuária, razão por que a população da região Centro-Oeste se mantém predominantemente rural.',gab:'E',res:'Errado: apesar da força do agronegócio, a população do Centro-Oeste é majoritariamente URBANA — a conclusão não decorre logicamente da premissa sobre o solo.'},
 {id:'p23_15',assuntoId:'bio_ecologia',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2023,itemOriginal:15,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'O desmatamento nos biomas brasileiros tende a afetar o clima, uma vez que, quanto menos florestas, maior a concentração de calor na superfície terrestre e menor a retenção da água da chuva.',gab:'C',res:'Correto: florestas regulam temperatura e ajudam a reter água no solo; sua remoção intensifica calor e reduz retenção hídrica.'},
 {id:'p23_87',assuntoId:'socio_marcadores',tipo:'CE',dif:'medio',diag:false,oficial:true,ano:2023,itemOriginal:87,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'O aumento da expectativa de vida no Brasil não foi acompanhado de políticas de salvaguarda à população idosa, visto que inexiste legislação no país que priorize pessoas com idade acima de 60 anos.',gab:'E',res:'Errado: o Brasil possui legislação específica de proteção ao idoso (como o Estatuto do Idoso) — é falso dizer que "inexiste legislação".'},
 {id:'p23_88',assuntoId:'geo_urbanizacao',tipo:'CE',dif:'dificil',diag:false,pas:true,oficial:true,ano:2023,itemOriginal:88,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'As revoluções industriais melhoraram condições sanitárias e o acesso à educação e à saúde, porém esse conjunto de políticas não foi suficiente para eliminar as desigualdades socioespaciais, principalmente nos países do Sul global, dada a forma como isso interferiu na dinâmica populacional urbana.',gab:'C',res:'Correto: a industrialização trouxe avanços, mas a urbanização acelerada nos países do Sul global (inclusive o Brasil) ocorreu de forma desigual, gerando periferias precárias.'},
 {id:'p23_95',assuntoId:'port_coesao',tipo:'CE',dif:'dificil',diag:false,pas:true,oficial:true,ano:2023,itemOriginal:95,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'Em um texto sobre acessibilidade: "Idosos, aqueles que enfrentam problemas de saúde e pessoas com deficiência estão entre os mais prejudicados." O segmento "aqueles que enfrentam problemas de saúde" restringe o sentido do termo "Idosos".',gab:'E',res:'Errado: são três grupos coordenados e distintos (idosos / pessoas com problemas de saúde / pessoas com deficiência), não uma restrição do primeiro pelo segundo.'},
 {id:'p23_99',assuntoId:'socio_desigualdades',tipo:'CE',dif:'facil',diag:false,oficial:true,ano:2023,itemOriginal:99,fonte:'PAS 1 — Subprograma 2023, Cebraspe/UnB',enun:'A falta de acessibilidade a espaços públicos e privados nas cidades brasileiras pode ser considerada uma forma de exclusão e segregação, pois restringe a mobilidade e o direito de todos os cidadãos aos espaços urbanos.',gab:'C',res:'Correto: acessibilidade é condição para o exercício pleno da cidadania urbana; sua ausência exclui pessoas com deficiência e mobilidade reduzida.'},
];

    dailyPlan:null, // {date,tasks:[...]}
    achievements:[],
    obrasStatus:{}, // obraId -> 'novo'|'estudando'|'dominado'
    history:[], // {date, accuracy, dominio}
  };
}
let STATE = load();
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const def = defaultState();
    const defDiagnostic = def.diagnostic, defProfile = def.profile; // guarda os defaults antes do Object.assign raso sobrescrever
    const merged = Object.assign(def, parsed);
    merged.diagnostic = Object.assign(defDiagnostic, parsed.diagnostic||{});
    merged.profile = Object.assign(defProfile, parsed.profile||{});
    return merged;
  }catch(e){return defaultState();}
}
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }

function contentFor(assuntoId){
  if(!STATE.content[assuntoId]) STATE.content[assuntoId] = {attempts:0,correct:0,status:'red',lastSeen:null,srDue:null,srInterval:0,firstDate:null};
  const c = STATE.content[assuntoId];
  if(c.correctWeighted==null) c.correctWeighted = c.correct||0; // migração: registros antigos sem confiança herdam o valor bruto
  if(!c.recent) c.recent = [];
  return c;
}
function weightedAcc(c){
  if(!c.attempts) return null;
  const cw = c.correctWeighted!=null ? c.correctWeighted : c.correct;
  return cw/c.attempts;
}

/* ============================= PHASE & PRIORITY ============================= */
function daysLeft(){ return Math.max(0, daysBetween(new Date(), EXAM_DATE)); }
function totalPlanDays(){ return Math.max(1, daysBetween(new Date(STATE.startDate+'T00:00:00'), EXAM_DATE)); }
function phaseInfo(){
  const total = totalPlanDays(), left = daysLeft();
  const elapsedPct = 1 - (left/total);
  if(elapsedPct < .25) return {n:1,nome:'Base',foco:'Fundamentos e interpretação',contPrat:[70,30]};
  if(elapsedPct < .55) return {n:2,nome:'Aprendizado + Exercícios',foco:'Conteúdo + prática crescente',contPrat:[40,60]};
  if(elapsedPct < .80) return {n:3,nome:'Modo PAS',foco:'Questões estilo PAS e interdisciplinaridade',contPrat:[20,80]};
  if(elapsedPct < .95) return {n:4,nome:'Simulados',foco:'Simulados e correção de rota',contPrat:[10,90]};
  return {n:5,nome:'Reta Final',foco:'Revisão, erros recorrentes e estratégia',contPrat:[5,95]};
}
function accuracyOf(assuntoId){
  const c = STATE.content[assuntoId];
  if(!c || c.attempts===0) return null;
  return c.correct/c.attempts; // acerto bruto, exibido ao aluno — não ponderado por confiança
}
function statusFromAccuracy(acc, attempts, firstDate){
  if(attempts===0 || acc===null) return 'red';
  if(acc<0.40) return 'red';
  if(acc<0.70) return 'orange';
  if(acc<0.85) return 'yellow';
  // green requires retention: at least one attempt logged 2+ days after first attempt
  if(firstDate){
    const days = daysBetween(new Date(firstDate+'T00:00:00'), new Date());
    if(days>=2) return 'green';
  }
  return 'yellow';
}
function refreshAllStatuses(){
  ASSUNTOS.forEach(a=>{
    const c = contentFor(a.id);
    c.status = statusFromAccuracy(weightedAcc(c), c.attempts, c.firstDate);
  });
}
function diagnosticAccFor(materiaId){
  const s = STATE.diagnostic.materiaScore && STATE.diagnostic.materiaScore[materiaId];
  return s ? s.acc : null;
}
function recentDeclineBoost(c){
  if(c.recent.length<3) return 0;
  const overall = weightedAcc(c); if(overall===null) return 0;
  const recentAcc = c.recent.filter(Boolean).length/c.recent.length;
  return recentAcc < overall-0.15 ? 3 : 0; // desempenho recente pior que a média histórica: sobe prioridade
}
function priorityScore(assunto){
  const c = contentFor(assunto.id);
  const diagAcc = diagnosticAccFor(assunto.materiaId);
  const acc = c.attempts ? weightedAcc(c) : (diagAcc!=null ? diagAcc : 0.3); // sem tentativas: usa diagnóstico, senão assume fraco
  const dificuldade = 1-acc;
  const erros = STATE.errors.filter(e=>e.assuntoId===assunto.id && !e.resolvido).length;
  const dueBoost = (c.srDue && c.srDue<=todayISO()) ? 6 : 0;
  const masteryPenalty = c.status==='green' ? 8 : 0;
  const recente = recentDeclineBoost(c);
  const left = daysLeft();
  const urgencyMult = left<=20 ? 1.35 : left<=45 ? 1.15 : 1; // tempo restante: aperta prioridade dos pesados perto da prova
  return ((assunto.peso*2) + (dificuldade*4) + Math.min(erros,5) + dueBoost + recente - masteryPenalty) * urgencyMult;
}
function rankedAssuntos(){
  return [...ASSUNTOS].sort((a,b)=>priorityScore(b)-priorityScore(a));
}
function priorityBadge(assunto){
  const score = priorityScore(assunto);
  if(score>=22) return {emoji:'🔥',label:'Prioridade máxima',cls:'b-red'};
  if(score>=14) return {emoji:'🟠',label:'Alta prioridade',cls:'b-orange'};
  if(score>=7) return {emoji:'🟡',label:'Média prioridade',cls:'b-yellow'};
  return {emoji:'⚪',label:'Baixa prioridade',cls:'b-neutral'};
}

/* ============================= SPACED REPETITION ============================= */
const SR_STEPS = [1,7,15,30];
function scheduleSR(assuntoId, wasCorrect){
  const c = contentFor(assuntoId);
  if(!wasCorrect){ c.srInterval = 0; }
  else { c.srInterval = Math.min(c.srInterval+1, SR_STEPS.length-1); }
  const days = SR_STEPS[c.srInterval] || 1;
  const due = new Date(); due.setDate(due.getDate()+days);
  c.srDue = due.toISOString().slice(0,10);
}
function dueReviewsToday(){
  const today = todayISO();
  const contentDue = ASSUNTOS.filter(a=>{const c=contentFor(a.id); return c.srDue && c.srDue<=today;});
  const errorsDue = STATE.errors.filter(e=>e.nextReview && e.nextReview<=today);
  return {contentDue, errorsDue};
}

/* ============================= ERROR NOTEBOOK ============================= */
const MOTIVOS = ['não sabia o conteúdo','esqueci','interpretação','cálculo','distração','confundiu conceitos','pressa','estratégia inadequada'];
const MOTIVO_CHIPS = [
  {key:'não sabia o conteúdo', emoji:'🧠', label:'Não sabia'},
  {key:'interpretação', emoji:'👀', label:'Interpretação'},
  {key:'cálculo', emoji:'🧮', label:'Cálculo'},
  {key:'pressa', emoji:'⚡', label:'Pressa'},
  {key:'estratégia inadequada', emoji:'🤷', label:'Chute'},
  {key:'confundiu conceitos', emoji:'🔀', label:'Confusão'},
];
const CONFIDENCE = [
  {key:'chute', emoji:'😬', label:'Chutei', peso:0.6},
  {key:'meio', emoji:'🤔', label:'Mais ou menos', peso:0.85},
  {key:'certeza', emoji:'😎', label:'Tenho certeza', peso:1},
];
function registrarErro(q, minhaResposta, tempoSeg, motivo){
  const existing = STATE.errors.find(e=>e.questionId===q.id && !e.resolvido);
  if(existing){
    existing.vezes++; existing.data=todayISO(); existing.minhaResposta=minhaResposta; existing.motivo=motivo;
    existing.nextReview = addDays(todayISO(),1);
  } else {
    STATE.errors.unshift({id:'err_'+Date.now(), questionId:q.id, assuntoId:q.assuntoId, minhaResposta, correta:q.tipo==='MC'?q.opts[q.gab]:q.gab, data:todayISO(), tempo:tempoSeg, vezes:1, motivo, nextReview:addDays(todayISO(),1)});
  }
}
function addDays(iso,n){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function registrarAcertoErroReview(errId){
  const e = STATE.errors.find(x=>x.id===errId);
  if(!e) return;
  const idx = SR_STEPS.indexOf(e._step||1);
  e._step = SR_STEPS[Math.min((idx<0?0:idx)+1, SR_STEPS.length-1)];
  e.nextReview = addDays(todayISO(), e._step);
  if(e._step>=30) e.resolvido = true;
}

/* ============================= ANSWER / XP ============================= */
function answerQuestion(q, correct){
  if(q.assuntoId){
    const c = contentFor(q.assuntoId);
    c.attempts++; if(correct) c.correct++;
    c.recent.push(correct); if(c.recent.length>6) c.recent.shift();
    if(!c.firstDate) c.firstDate = todayISO();
    c.lastSeen = todayISO();
    c.status = statusFromAccuracy(weightedAcc(c), c.attempts, c.firstDate); // recalculado de novo assim que a confiança é escolhida (setConfidence)
    scheduleSR(q.assuntoId, correct);
  }
  if(!STATE.qStats[q.id]) STATE.qStats[q.id] = {seen:0,correct:0};
  STATE.qStats[q.id].seen++; if(correct) STATE.qStats[q.id].correct++;
  STATE.profile.xp += correct? 10 : 3;
  bumpStreak();
  save();
}
function bumpStreak(){
  const today = todayISO();
  if(STATE.profile.lastStudyDate===today) return;
  const yesterday = addDays(today,-1);
  STATE.profile.streak = (STATE.profile.lastStudyDate===yesterday) ? STATE.profile.streak+1 : 1;
  STATE.profile.lastStudyDate = today;
}
function setConfidence(confKey){
  const s = QUIZ_SESSION; if(!s) return;
  const r = s.results[s.idx]; const q = s.questions[s.idx];
  r.confidence = confKey;
  if(q.assuntoId){
    const c = contentFor(q.assuntoId);
    const conf = CONFIDENCE.find(x=>x.key===confKey) || CONFIDENCE[1];
    if(r.correct) c.correctWeighted = (c.correctWeighted||0) + conf.peso;
    c.status = statusFromAccuracy(weightedAcc(c), c.attempts, c.firstDate);
  }
  save(); render();
}

/* ============================= DAILY PLAN ============================= */
function taskDuration(type){
  return {aprender:18, questoes:22, revisao:12, obra:12, erros:10}[type] || 15;
}
function buildDailyPlan(minutes, opts){
  opts = opts || {};
  const phase = phaseInfo();
  const {contentDue, errorsDue} = dueReviewsToday();
  // modo relâmpago: só cabe UMA tarefa, então escolhe direto a de maior retorno (erro pendente > revisão vencida > ponto fraco)
  if(opts.fast){
    if(errorsDue.length) return {date:todayISO(), minutes, fast:true, tasks:[{id:'t_err',type:'erros',titulo:'Caderno de erros',sub:`Refazer ${Math.min(errorsDue.length,5)} questões que você já errou`,dur:minutes,status:'pendente'}]};
    if(contentDue.length){ const a=contentDue[0]; return {date:todayISO(), minutes, fast:true, tasks:[{id:'t_rev',type:'revisao',titulo:`Revisão — ${a.nome}`,sub:`${a.materiaNome} · revisão espaçada`,dur:minutes,assuntoId:a.id,status:'pendente'}]}; }
    const w = rankedAssuntos()[0];
    return {date:todayISO(), minutes, fast:true, tasks:[{id:'t_q_'+w.id,type:'questoes',titulo:`Questões — ${w.nome}`,sub:`${w.materiaNome} · treino relâmpago`,dur:minutes,assuntoId:w.id,status:'pendente'}]};
  }
  const tasks = [];
  let budget = minutes;
  // 1) spaced errors due (highest ROI: known content, fixable fast)
  if(errorsDue.length && budget>=taskDuration('erros')){
    tasks.push({id:'t_err',type:'erros',titulo:'Caderno de erros',sub:`Refazer ${Math.min(errorsDue.length,6)} questões que você já errou`,dur:taskDuration('erros'),status:'pendente'});
    budget -= taskDuration('erros');
  }
  // 2) spaced content review due
  if(contentDue.length && budget>=taskDuration('revisao')){
    const a = contentDue[0];
    tasks.push({id:'t_rev',type:'revisao',titulo:`Revisão — ${a.nome}`,sub:`${a.materiaNome} · revisão espaçada`,dur:taskDuration('revisao'),assuntoId:a.id,status:'pendente'});
    budget -= taskDuration('revisao');
  }
  // 3) fill with priority ranked assuntos, respecting phase content/practice ratio
  const ranked = rankedAssuntos().filter(a=>!tasks.find(t=>t.assuntoId===a.id));
  const pctContent = opts.tired ? Math.min(phase.contPrat[0], 20) : phase.contPrat[0]; // cansado: prioriza prática rápida (maior retorno) sobre aprender conteúdo novo
  let i=0;
  while(budget >= 10 && i < ranked.length){
    const a = ranked[i]; i++;
    const c = contentFor(a.id);
    const isNew = c.attempts===0;
    const useContent = isNew && (Math.random()*100 < pctContent || c.status==='red');
    if(useContent && budget>=taskDuration('aprender')){
      tasks.push({id:'t_learn_'+a.id,type:'aprender',titulo:`Aprender — ${a.nome}`,sub:`${a.materiaNome} · nível 1-4`,dur:taskDuration('aprender'),assuntoId:a.id,status:'pendente'});
      budget -= taskDuration('aprender');
    } else if(budget>=taskDuration('questoes') && questoesPorAssunto(a.id).length){
      tasks.push({id:'t_q_'+a.id,type:'questoes',titulo:`Questões — ${a.nome}`,sub:`${a.materiaNome} · treino`,dur:taskDuration('questoes'),assuntoId:a.id,status:'pendente'});
      budget -= taskDuration('questoes');
    }
    if(tasks.length>=6) break;
  }
  // 4) obra review if room and phase not too advanced-practice-only
  const obraPending = OBRAS.find(o=>(STATE.obrasStatus[o.id]||'novo')!=='dominado');
  if(obraPending && budget>=taskDuration('obra')){
    tasks.push({id:'t_obra',type:'obra',titulo:'Obra PAS',sub:`${obraPending.titulo}${obraPending.autor? ' — '+obraPending.autor:''}`,dur:taskDuration('obra'),obraId:obraPending.id,status:'pendente'});
    budget -= taskDuration('obra');
  }
  if(!tasks.length){
    tasks.push({id:'t_fallback',type:'questoes',titulo:'Treino rápido geral',sub:'5 questões variadas',dur:Math.min(minutes,15),status:'pendente'});
  }
  return {date:todayISO(), minutes, tired:!!opts.tired, tasks};
}
function ensureTodayPlan(){
  if(STATE.dailyPlan && STATE.dailyPlan.date===todayISO()) return STATE.dailyPlan;
  return null;
}

function startTaskById(taskId){

  if(!task) return;
  ACTIVE_TASK = {...task, _nivel:1};
  if(task.type==='questoes'||task.type==='revisao'){
    const list = task.assuntoId? questoesPorAssunto(task.assuntoId) : shuffle(QUESTOES).slice(0,5);
    startQuiz(shuffle(list), task.type);
  } else if(task.type==='erros'){
    const ids = STATE.errors.filter(e=>!e.resolvido && e.nextReview<=todayISO()).slice(0,6).map(e=>e.questionId);
    startQuiz(QUESTOES.filter(q=>ids.includes(q.id)), 'erros');
  } else { render(); }
}
function weakestAssunto(){
  const seen = ASSUNTOS.filter(a=>contentFor(a.id).attempts>0);
  if(!seen.length) return null;
  return seen.sort((a,b)=>(accuracyOf(a.id)) - (accuracyOf(b.id)))[0];
}
function strongestAssunto(){
  const seen = ASSUNTOS.filter(a=>contentFor(a.id).attempts>=2);
  if(!seen.length) return null;
  return seen.sort((a,b)=>(accuracyOf(b.id)) - (accuracyOf(a.id)))[0];
}

function alertsHTML(){
  const alerts = [];
  // no diagnostic
  if(!STATE.diagnostic.done){
    alerts.push({icon:'🧭',text:'Você ainda não fez o diagnóstico inicial. Ele define seu plano — faça antes de continuar.',action:'diagnostico'});
  }
  // materia sem revisão há muitos dias
  AREAS.forEach(area=>area.materias.forEach(mat=>{
    const seenDates = mat.assuntos.map(a=>contentFor(a.id).lastSeen).filter(Boolean);
    if(seenDates.length){
      const mostRecent = seenDates.sort().reverse()[0];
      const dias = daysBetween(new Date(mostRecent+'T00:00:00'), new Date());
      if(dias>=10) alerts.push({icon:'⚠️',text:`Você não revisa ${mat.nome} há ${dias} dias.`});
    }
  }));
  const left = daysLeft();
  if(left<=20 && left>0) alerts.push({icon:'🎯',text:`Faltam ${left} dias. É hora de intensificar simulados e revisão.`});
  if(!alerts.length) return '';
  return alerts.slice(0,3).map(a=>`<div class="card-flat row" style="border-left:3px solid var(--accent-2);">${a.icon} <span style="font-size:.86rem;">${a.text}</span></div>`).join('');

function submitAnswer(val){
  const s = QUIZ_SESSION; const q = s.questions[s.idx];
  const correct = q.tipo==='CE' ? (val===q.gab) : (Number(val)===q.gab);
  const tempo = Math.round((Date.now()-s.qStartTs)/1000);
  s.results[s.idx] = {resposta: q.tipo==='CE'? val : Number(val), correct, tempo};
  if(correct) s.correctCount++;
  answerQuestion(q, correct);
  s.answered = true;
  render();
}
function finalizeCurrentAnswer(){
  const s = QUIZ_SESSION; const q = s.questions[s.idx]; const r = s.results[s.idx];
  if(!r.correct && q.assuntoId){
    registrarErro(q, r.resposta, r.tempo, r.motivo || MOTIVOS[0]);
  } else if(r.correct && q.assuntoId){
    const err = STATE.errors.find(e=>e.questionId===q.id && !e.resolvido);
    if(err) registrarAcertoErroReview(err.id); // acerto confiante empurra a revisão espaçada pra frente (1→7→15→30)
  }
  if(ACTIVE_TASK && ACTIVE_TASK.type==='diagnostico'){ STATE.diagnostic.inProgress = JSON.parse(JSON.stringify(s)); }
  s.idx++; s.answered=false; s.qStartTs=Date.now();
  save(); render();
}

function computeMindMap(area){
  const multi = area.materias.length>1;
  const rMateria = multi? 95: 0;
  const rAssunto = multi? 185: 150;
  const size = Math.round((rAssunto+95)*2);
  const cx = size/2, cy = size/2;
  const totalAssuntos = area.materias.reduce((s,m)=>s+m.assuntos.length,0);
  const gap = multi? (Math.PI*2*0.025) : 0;
  let angleCursor = -Math.PI/2;
  const nodes = [], links = [];
  area.materias.forEach(mat=>{
    const sectorAngle = (mat.assuntos.length/totalAssuntos) * (Math.PI*2 - gap*area.materias.length);
    const matMid = angleCursor + sectorAngle/2;
    let matX=cx, matY=cy;
    if(multi){
      matX = cx + rMateria*Math.cos(matMid);
      matY = cy + rMateria*Math.sin(matMid);
      nodes.push({type:'materia', nome:mat.nome, x:matX, y:matY});
      links.push({x1:cx,y1:cy,x2:matX,y2:matY});
    }
    const n = mat.assuntos.length;
    mat.assuntos.forEach((a,i)=>{
      const ang = angleCursor + (sectorAngle*(i+0.5)/n);
      const ax = cx + rAssunto*Math.cos(ang);
      const ay = cy + rAssunto*Math.sin(ang);
      nodes.push({type:'assunto', id:a.id, nome:a.nome, status:contentFor(a.id).status, x:ax, y:ay, angle:ang});
      links.push({x1:matX,y1:matY,x2:ax,y2:ay});
    });
    angleCursor += sectorAngle + gap;
  });
  return {nodes, links, cx, cy, size};
}

function nodeSVG(n){

    </g>`;
  }
  const colorMap = {red:'var(--red)',orange:'var(--orange)',yellow:'var(--yellow)',green:'var(--green)'};
  const dx = Math.cos(n.angle), dy = Math.sin(n.angle);
  const labelX = n.x + dx*12, labelY = n.y + dy*12 + 3;
  const anchor = dx > 0.2 ? 'start' : dx < -0.2 ? 'end' : 'middle';
  return `<g style="cursor:pointer;" data-action="assunto-detail" data-assunto="${n.id}">
    <title>${escapeXML(n.nome)}</title>
    <circle cx="${n.x}" cy="${n.y}" r="6" style="fill:${colorMap[n.status]||'var(--muted)'};stroke:var(--surface);stroke-width:1.5;"/>
    <text x="${labelX}" y="${labelY}" text-anchor="${anchor}" font-size="8.5" style="fill:var(--ink-soft);font-family:var(--font-body);">${escapeXML(truncateLabel(n.nome,22))}</text>
  </g>`;
}

  return `

function startDiagnostic(){
  ACTIVE_TASK = {type:'diagnostico'};
  STATE.diagnostic.inProgress = null;
  const diagQs = QUESTOES.filter(q=>q.diag);
  startQuiz(shuffle(diagQs), 'diagnostico');
}
function resumeDiagnostic(){
  ACTIVE_TASK = {type:'diagnostico'};
  QUIZ_SESSION = STATE.diagnostic.inProgress;
  render();
}
function finishDiagnostic(){
  const byMateria = {};
  QUIZ_SESSION.questions.forEach((q,i)=>{
    const a = getAssunto(q.assuntoId);
    if(!byMateria[a.materiaId]) byMateria[a.materiaId] = {total:0,correct:0};
    byMateria[a.materiaId].total++;
    if(QUIZ_SESSION.results[i] && QUIZ_SESSION.results[i].correct) byMateria[a.materiaId].correct++;
  });
  const materiaScore = {};
  Object.entries(byMateria).forEach(([mid,d])=>{
    const acc = d.correct/d.total;
    const nivel = acc<0.4?'baixo':acc<0.7?'médio':'alto';
    const prioridade = acc<0.4?'MUITO ALTA':acc<0.7?'ALTA':'MÉDIA';
    materiaScore[mid] = {nivel,prioridade,acc};
  });
  const top3 = Object.entries(materiaScore).sort((a,b)=>a[1].acc-b[1].acc).slice(0,3).map(([mid])=>mid);
  STATE.diagnostic = {done:true, materiaScore, top3};
  STATE.dailyPlan = null; // força replanejar já considerando o novo diagnóstico
  save();
}

function shuffle(arr){return [...arr].sort(()=>Math.random()-0.5);}
function startModeQuiz(mode){
  ACTIVE_TASK = {type:'banco', mode};
  const base = mode==='erros' ? QUESTOES : applyFilters(QUESTOES);
  let list = [];
  if(mode==='rapido') list = shuffle(base).slice(0,5);
  else if(mode==='padrao') list = shuffle(base).slice(0,10);
  else if(mode==='intensivo') list = shuffle(base).slice(0,20);
  else if(mode==='erros'){
    const ids = STATE.errors.filter(e=>!e.resolvido).map(e=>e.questionId);
    list = QUESTOES.filter(q=>ids.includes(q.id));
  } else if(mode==='fraco'){
    const w = weakestAssunto();
    list = w? applyFilters(questoesPorAssunto(w.id)) : [];
  } else if(mode==='pas'){
    list = shuffle(base.filter(q=>q.pas || q.dif==='dificil'));
  } else if(mode==='oficiais'){
    list = shuffle(applyFilters(QUESTOES.filter(q=>q.oficial)));
  }
  startQuiz(list, mode);
}

      const as = area.materias.flatMap(m=>m.assuntos);
      const seen = as.filter(a=>contentFor(a.id).attempts>0);
      const avgAcc = seen.length? Math.round(seen.reduce((s,a)=>s+accuracyOf(a.id),0)/seen.length*100) : null;
      return `<div style="margin-bottom:10px;">
        <div class="row-between"><span style="font-size:.85rem;font-weight:600;">${area.emoji} ${area.nome}</span><span class="mono" style="font-size:.8rem;">${avgAcc===null?'—':avgAcc+'%'}</span></div>
        <div class="bar"><div style="width:${avgAcc||0}%"></div></div>
      </div>`;
    }).join('')}
  </div>
  <div class="card">
    <h3>Backup dos seus dados</h3>
    <p style="font-size:.85rem;color:var(--muted);">Seus dados ficam salvos neste navegador. Ainda não há conta/nuvem — exporte um backup de vez em quando para não perder o progresso.</p>
    <div class="row" style="gap:8px;">
      <button class="btn btn-secondary" data-action="export">⬇️ Exportar backup</button>
      <label class="btn btn-secondary" style="position:relative;overflow:hidden;">⬆️ Importar backup
        <input type="file" id="importFile" accept="application/json" style="position:absolute;inset:0;opacity:0;cursor:pointer;">
      </label>
    </div>
  </div>
  `;
}

/* ============================= MODAL ============================= */
function modalHTML(){
  if(MODAL==='customTime'){
    return `<div class="modal-bg" data-action="close-modal"><div class="modal" onclick="event.stopPropagation()">
      <h3>Quantos minutos você tem hoje?</h3>
      <input type="number" id="customMinutes" class="chip-input" placeholder="ex: 45" min="10" max="300">
      <button class="btn btn-primary btn-block" style="margin-top:12px;" data-action="confirm-custom-time">Confirmar</button>
    </div></div>`;
  }
  if(MODAL==='assuntoDetail'){
    return assuntoDetailModalHTML(ASSUNTO_DETAIL_ID);
  }
  return '';
}

/* ============================= EVENTS ============================= */
function attachEvents(){
  document.querySelectorAll('[data-route]').forEach(el=>el.addEventListener('click',()=>{ROUTE=el.dataset.route; ACTIVE_TASK=null; QUIZ_SESSION=null; render();}));
  document.querySelectorAll('[data-time]').forEach(el=>el.addEventListener('click',()=>{
    const v = el.dataset.time;
    if(v==='custom'){ MODAL='customTime'; render(); return; }
    STATE.dailyPlan = buildDailyPlan(Number(v)); save(); render();
  }));
  const tiredBtn = document.querySelector('[data-action="tired"]');
  if(tiredBtn) tiredBtn.addEventListener('click',()=>{
    STATE.profile.tiredToday = true;
    STATE.dailyPlan = buildDailyPlan(30,{tired:true});
    save(); render();
  });
  const replanBtn = document.querySelector('[data-action="replan"]');
  if(replanBtn) replanBtn.addEventListener('click',()=>{ STATE.dailyPlan=null; save(); render(); });
  document.querySelectorAll('[data-action="skip-task"]').forEach(el=>el.addEventListener('click',()=>{
    const t = STATE.dailyPlan.tasks.find(x=>x.id===el.dataset.task);
    if(t) t.status='pulada';
    save(); render();
  }));

  document.querySelectorAll('[data-action="start-task"]').forEach(el=>el.addEventListener('click',()=>startTaskById(el.dataset.task)));
  const missionBtn = document.querySelector('[data-action="start-mission"]');
  if(missionBtn) missionBtn.addEventListener('click',()=>{
    const t = STATE.dailyPlan.tasks.find(x=>x.status==='pendente');
    if(t) startTaskById(t.id);
  });
  const fast10Btn = document.querySelector('[data-action="fast10"]');
  if(fast10Btn) fast10Btn.addEventListener('click',()=>{
    STATE.dailyPlan = buildDailyPlan(10,{fast:true}); save(); render();
  });

  document.querySelectorAll('[data-action="practice-assunto"]').forEach(el=>el.addEventListener('click',()=>{
    ACTIVE_TASK = {type:'banco'};
    ROUTE='questoes';
    startQuiz(shuffle(applyFilters(questoesPorAssunto(el.dataset.assunto))), 'assunto');
  }));

  document.querySelectorAll('[data-filter]').forEach(el=>el.addEventListener('change',()=>{
    FILTERS[el.dataset.filter] = el.value; render();
  }));
  document.querySelectorAll('[data-action="mapa-view"]').forEach(el=>el.addEventListener('click',()=>{
    MAPA_VIEW = el.dataset.view; render();
  }));
  document.querySelectorAll('[data-action="mindmap-area"]').forEach(el=>el.addEventListener('click',()=>{
    MINDMAP_AREA = el.dataset.area; render();
  }));
  document.querySelectorAll('[data-action="assunto-detail"]').forEach(el=>el.addEventListener('click',()=>{
    MODAL = 'assuntoDetail'; ASSUNTO_DETAIL_ID = el.dataset.assunto; render();
  }));
  document.querySelectorAll('[data-action="detail-aprender"]').forEach(el=>el.addEventListener('click',()=>{
    ACTIVE_TASK = {type:'aprender', assuntoId:el.dataset.assunto, _nivel:1};
    MODAL=null; QUIZ_SESSION=null; ROUTE='home'; render();
  }));
  document.querySelectorAll('[data-action="detail-praticar"]').forEach(el=>el.addEventListener('click',()=>{
    const assuntoId = el.dataset.assunto;
    MODAL=null; ACTIVE_TASK={type:'banco'}; ROUTE='questoes';
    startQuiz(shuffle(applyFilters(questoesPorAssunto(assuntoId))), 'assunto');
  }));

  const cancelBtn = document.querySelector('[data-action="cancel-task"]');
  if(cancelBtn) cancelBtn.addEventListener('click',()=>{ ACTIVE_TASK=null; QUIZ_SESSION=null; render(); });

  const finishBtn = document.querySelector('[data-action="finish-task"]');
  if(finishBtn) finishBtn.addEventListener('click',()=>{
    if(ACTIVE_TASK && ACTIVE_TASK.type==='diagnostico') finishDiagnostic();
    if(STATE.dailyPlan && ACTIVE_TASK && ACTIVE_TASK.id){
      const t = STATE.dailyPlan.tasks.find(x=>x.id===ACTIVE_TASK.id);
      if(t) t.status='concluida';
    }
    ACTIVE_TASK=null; QUIZ_SESSION=null; save(); render();
  });

  document.querySelectorAll('[data-action="answer"]').forEach(el=>el.addEventListener('click',()=>{
    submitAnswer(el.dataset.val);
  }));
  document.querySelectorAll('[data-action="answer-num"]').forEach(el=>el.addEventListener('click',()=>{
    const input = document.getElementById('numAnswer');
    const val = input ? input.value : '';
    if(val===''){ alert('Digite um número antes de confirmar.'); return; }
    submitAnswer(val);
  }));
  const nextQ = document.querySelector('[data-action="next-question"]');
  if(nextQ) nextQ.addEventListener('click', finalizeCurrentAnswer);
  document.querySelectorAll('[data-action="pick-confidence"]').forEach(el=>el.addEventListener('click',()=>{
    setConfidence(el.dataset.conf);
  }));
  document.querySelectorAll('[data-action="pick-motivo"]').forEach(el=>el.addEventListener('click',()=>{
    const s = QUIZ_SESSION; s.results[s.idx].motivo = el.dataset.motivo; render();
  }));

  const startDiag = document.querySelector('[data-action="start-diagnostic"]');
  if(startDiag) startDiag.addEventListener('click', startDiagnostic);
  const resumeDiag = document.querySelector('[data-action="resume-diagnostic"]');
  if(resumeDiag) resumeDiag.addEventListener('click', resumeDiagnostic);

  document.querySelectorAll('[data-action="mode"]').forEach(el=>el.addEventListener('click',()=>{
    ROUTE='questoes'; startModeQuiz(el.dataset.mode);
  }));
  document.querySelectorAll('[data-action="retry-error"]').forEach(el=>el.addEventListener('click',()=>{
    const err = STATE.errors.find(e=>e.id===el.dataset.err);
    if(!err) return;
    ACTIVE_TASK = {type:'banco', mode:'erros'};
    startQuiz([getQuestao(err.questionId)], 'erros');
  }));
  const gotoQ = document.querySelector('[data-action="goto-questoes"]');
  if(gotoQ) gotoQ.addEventListener('click',()=>{ ROUTE='questoes'; render(); });

  document.querySelectorAll('[data-action="nivel-next"]').forEach(el=>el.addEventListener('click',()=>{
    ACTIVE_TASK._nivel = (ACTIVE_TASK._nivel||1)+1; render();
  }));
  document.querySelectorAll('[data-action="go-quiz"]').forEach(el=>el.addEventListener('click',()=>{
    startQuiz(shuffle(questoesPorAssunto(el.dataset.assunto)), 'aprender-quiz');
  }));
  document.querySelectorAll('[data-action="complete-task"]').forEach(el=>el.addEventListener('click',()=>{
    if(STATE.dailyPlan && ACTIVE_TASK.id){ const t=STATE.dailyPlan.tasks.find(x=>x.id===ACTIVE_TASK.id); if(t) t.status='concluida'; }
    ACTIVE_TASK=null; save(); render();
  }));

  document.querySelectorAll('[data-action="study-obra"]').forEach(el=>el.addEventListener('click',()=>startObraStudy(el.dataset.obra)));
  document.querySelectorAll('[data-action="obra-status"]').forEach(el=>el.addEventListener('click',()=>{
    STATE.obrasStatus[el.dataset.obra] = el.dataset.status;
    if(STATE.dailyPlan && ACTIVE_TASK.id){ const t=STATE.dailyPlan.tasks.find(x=>x.id===ACTIVE_TASK.id); if(t) t.status='concluida'; }
    ACTIVE_TASK=null; save(); render();
  }));
  const obrasQuizBtn = document.querySelector('[data-action="obras-quiz"]');
  if(obrasQuizBtn) obrasQuizBtn.addEventListener('click', startObrasQuiz);
  const obrasReviewBtn = document.querySelector('[data-action="obras-review"]');
  if(obrasReviewBtn) obrasReviewBtn.addEventListener('click',()=>{
    const pending = OBRAS.filter(o=>(STATE.obrasStatus[o.id]||'novo')!=='dominado');
    if(pending.length) startObraStudy(shuffle(pending)[0].id);
  });

  document.querySelectorAll('[data-action="close-modal"]').forEach(el=>el.addEventListener('click',()=>{MODAL=null; render();}));
  const confirmCustom = document.querySelector('[data-action="confirm-custom-time"]');
  if(confirmCustom) confirmCustom.addEventListener('click',()=>{
    const v = Number(document.getElementById('customMinutes').value)||30;
    STATE.dailyPlan = buildDailyPlan(v); MODAL=null; save(); render();
  });

  const exportBtn = document.querySelector('[data-action="export"]');
  if(exportBtn) exportBtn.addEventListener('click', doExport);
  const importFile = document.getElementById('importFile');
  if(importFile) importFile.addEventListener('change', doImport);
}

async function doExport(){
  const data = JSON.stringify(STATE, null, 2);
  const downloads = await (window.claude && window.claude.use ? window.claude.use('downloads') : Promise.resolve(null));
  if(downloads){
    await downloads.save({filename:`ipe-pas1-backup-${todayISO()}.json`, data});
  } else {
    alert('Exportação de arquivo não disponível neste ambiente.');
  }
}
function doImport(ev){
  const file = ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const parsed = JSON.parse(e.target.result);
      STATE = Object.assign(defaultState(), parsed);
      save(); render();
    }catch(err){ alert('Arquivo inválido.'); }
  };
  reader.readAsText(file);
}

/* ============================= INIT ============================= */
render();
</script>
</body>
</html>
